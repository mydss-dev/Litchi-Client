name: Windows TUN Final Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-tun-refactor.yml'

permissions:
  contents: read

# Final pass: Windows uses a pure-Go isolated core and must ship no legacy DLL.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.7'
      - name: Test Flutter and core
        shell: bash
        run: |
          flutter pub get
          flutter test
          flutter analyze
          (cd core/singbox && go test -tags "with_clash_api,with_quic,with_utls,with_wireguard" ./...)
          git diff --check

  windows_verify:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.7'
      - name: Build isolated Windows TUN runtime
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --debug
          .\tool\bundle_windows_singbox.ps1 -ReleaseDir "build\windows\x64\runner\Debug"
          $release = Resolve-Path "build\windows\x64\runner\Debug"
          if (-not (Test-Path "$release\litchi-core.exe")) { throw "litchi-core.exe missing" }
          if (-not (Test-Path "$release\wintun.dll")) { throw "wintun.dll missing" }
          if (Test-Path "$release\litchi_singbox.dll") { throw "legacy litchi_singbox.dll still present" }
          if (Test-Path "$release\core\litchi_singbox.dll") { throw "legacy core/litchi_singbox.dll still present" }
          & "$release\litchi-core.exe" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
