name: Desktop IA Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-ia-finalize.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Apply final desktop IA
        shell: bash
        run: |
          python3 tool/desktop_ia_finalize.py
          dart format lib/app/nav_destinations.dart lib/app/app_shell.dart lib/features/account/account_page.dart
          flutter pub get
          flutter test
          flutter analyze
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          nav = Path('lib/app/nav_destinations.dart').read_text()
          shell = Path('lib/app/app_shell.dart').read_text()
          account = Path('lib/features/account/account_page.dart').read_text()
          assert 'desktopPrimaryDestinations' in nav
          assert 'desktopAccountDestinations' in nav
          assert 'CompactPlacement.primary' in nav and 'hubDestinations' in nav
          assert '_mainPages' not in shell and '_accountPages' not in shell
          assert '_SidebarGroupHeader' not in shell
          assert 'PopupMenuButton<_SidebarAccountAction>' not in shell
          assert 'desktopPrimaryDestinations' in shell
          assert 'ctrl.goToPage(AppPage.account)' in shell
          assert '_DesktopProfileMenuSection' not in account
          assert '_DesktopQuickTile' not in account
          desktop = account.split('Widget _buildDesktop', 1)[1].split('// ── Compact', 1)[0]
          assert '_TrafficOverviewCard' not in desktop
          assert '_DesktopAccountServices' in desktop
          assert '_DesktopAccountSettings' in desktop
          assert 'onManage:' not in desktop
          compact = account.split('Widget _buildCompact', 1)[1].split('// ── Desktop account widgets', 1)[0] if '// ── Desktop account widgets' in account.split('Widget _buildCompact', 1)[1] else account.split('Widget _buildCompact', 1)[1]
          assert 'onManage: _showAccountSheet' in account
          PY
      - name: Commit verified product changes
        shell: bash
        run: |
          rm tool/desktop_ia_finalize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(desktop): decouple navigation and account IA"
          git push origin HEAD:main

  windows-verify:
    needs: refactor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Build Windows debug
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --debug
