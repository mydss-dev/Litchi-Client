name: Trigger v1.1.3 Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.1.3.yml

permissions:
  actions: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.1.3
      TARGET: f4fe37fe1240ee91adb60eb30b3825ea976cc620
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Dispatch tagged CI
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$TAG"
          echo "Dispatched CI for $TAG ($TARGET)"

      - name: Wait for tagged CI
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for _ in $(seq 1 60); do
            RUN_ID="$(gh run list --workflow ci.yml --event workflow_dispatch --limit 30 \
              --json databaseId,headBranch,headSha,createdAt \
              --jq '.[] | select(.headBranch == env.TAG and .headSha == env.TARGET) | .databaseId' \
              | head -n 1)"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo 'Could not find dispatched CI run'
            exit 1
          fi
          echo "Watching CI run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status

      - name: Dispatch Publish
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish.yml --ref main -f tag="$TAG"
          echo "Dispatched Publish for $TAG"

      - name: Wait for Publish
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for _ in $(seq 1 60); do
            RUN_ID="$(gh run list --workflow publish.yml --event workflow_dispatch --limit 20 \
              --json databaseId,createdAt,status \
              --jq '.[0].databaseId // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo 'Could not find Publish run'
            exit 1
          fi
          echo "Watching Publish run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status
