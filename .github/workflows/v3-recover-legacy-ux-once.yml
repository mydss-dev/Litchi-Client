name: V3 Legacy UX Recovery (one-time)

on:
  push:
    branches: [fix/v3-recover-legacy-ux]
    paths:
      - '.github/workflows/v3-recover-legacy-ux-once.yml'
      - 'scripts/v3_legacy_ux_once.py'
      - 'test/v3_legacy_ux_test.dart'

permissions:
  contents: write

concurrency:
  group: v3-legacy-ux-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Apply strictly matched UI changes
        run: python3 scripts/v3_legacy_ux_once.py
      - run: flutter pub get
      - name: Format new regression tests
        run: dart format test/v3_legacy_ux_test.dart
      - name: Targeted recovered UX tests
        run: flutter test -r expanded test/v3_legacy_ux_test.dart
      - name: Full Flutter test suite
        run: flutter test
      - name: Static analysis
        run: flutter analyze
      - name: Commit validated UI changes to feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/v3_legacy_ux_once.py
          rm -f .github/workflows/v3-recover-legacy-ux-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'feat(v3): recover useful pre-refactor interactions without changing nodes'
          git push origin HEAD:fix/v3-recover-legacy-ux
