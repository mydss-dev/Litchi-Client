name: One-shot V3 four fixes v5
on:
  push:
    branches: [fix/v3-four-followup-regressions-20260920]
    paths: ['.github/workflows/one-shot-v3-four-fixes-v5.yml']
permissions:
  contents: write
jobs:
  apply-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Apply fixes and correct regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_v3_four_fixes.py
          python3 .github/scripts/fix_v3_four_tests.py
          sed -i '1i import "dart:async";' lib/v3/pages/v3_dashboard_page.dart
          python3 - <<'PY'
          from pathlib import Path
          a=Path('test/visual/v3_dashboard_workspace_test.dart')
          s=a.read_text()
          assert s.count('      expect(tester.takeException(), isNull);')==1
          s=s.replace('      expect(tester.takeException(), isNull);', '      debugDefaultTargetPlatformOverride = null;\n      expect(tester.takeException(), isNull);')
          assert s.count('    expect(tester.takeException(), isNull);')==1
          s=s.replace('    expect(tester.takeException(), isNull);', '    debugDefaultTargetPlatformOverride = null;\n    expect(tester.takeException(), isNull);')
          a.write_text(s)
          b=Path('test/visual/v3_lychee_selection_test.dart')
          t=b.read_text()
          assert t.count('      expect(tester.takeException(), isNull);')==2
          t=t.replace('      expect(tester.takeException(), isNull);', '      debugDefaultTargetPlatformOverride = null;\n      expect(tester.takeException(), isNull);',1)
          b.write_text(t)
          PY
      - run: flutter pub get
      - name: Format changed sources
        run: dart format lib/app/app_controller.dart lib/v3/pages/v3_dashboard_page.dart lib/v3/pages/v3_account_page.dart lib/v3/pages/v3_traffic_page.dart test/v3_four_followup_fixes_test.dart test/visual/v3_dashboard_workspace_test.dart test/visual/v3_lychee_selection_test.dart test/visual/v3_practical_ux_restore_test.dart
      - name: Targeted regressions
        run: flutter test test/v3_four_followup_fixes_test.dart test/visual/v3_dashboard_workspace_test.dart test/visual/v3_lychee_selection_test.dart test/visual/v3_practical_ux_restore_test.dart
      - name: Full Flutter suite
        run: flutter test
      - name: Static analysis
        run: flutter analyze
      - name: Commit verified fixes without temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-v3-four-fixes*.yml .github/scripts/apply_v3_four_fixes.py .github/scripts/fix_v3_four_tests.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(v3): guard plan evidence, tick duration and correct platform UI'
          git push origin HEAD:fix/v3-four-followup-regressions-20260920
