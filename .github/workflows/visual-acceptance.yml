name: V3 Visual Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/v3/**'
      - 'lib/app/app.dart'
      - 'lib/app/app_controller.dart'
      - 'lib/shared/models/**'
      - 'test/visual/**'
      - '.github/workflows/visual-acceptance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/v3/**'
      - 'lib/app/app.dart'
      - 'lib/app/app_controller.dart'
      - 'lib/shared/models/**'
      - 'test/visual/**'
      - '.github/workflows/visual-acceptance.yml'

concurrency:
  group: v3-visual-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Keep layout/overflow checks on all targets, without generating or uploading PNGs.
jobs:
  windows-layout-fallback:
    name: V3 Windows 900x700 (Linux render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Windows V3 layouts
        run: flutter test --name 'V3 Windows' test/visual/v3_visual_acceptance_test.dart

  windows-native:
    name: V3 Windows 900x700 (Native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Windows V3 layouts
        run: flutter test --name "V3 Windows" test/visual/v3_visual_acceptance_test.dart

  android-compact:
    name: V3 Android 360-390 compact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Android V3 layouts
        run: flutter test --name 'V3 Android' test/visual/v3_visual_acceptance_test.dart
