name: V3 Visual Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/v3/**'
      - 'lib/app/app.dart'
      - 'lib/app/app_controller.dart'
      - 'lib/shared/models/**'
      - 'test/visual/**'
      - '.github/workflows/visual-acceptance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/v3/**'
      - 'lib/app/app.dart'
      - 'lib/app/app_controller.dart'
      - 'lib/shared/models/**'
      - 'test/visual/**'
      - '.github/workflows/visual-acceptance.yml'

concurrency:
  group: v3-visual-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-layout-fallback:
    name: V3 Windows 900x700 (Linux render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: mkdir -p test/visual/goldens
      - name: Render V3 Windows light/dark snapshots
        run: >-
          flutter test
          --dart-define=LITCHI_VISUAL_SNAPSHOTS=true
          --update-goldens
          --name 'V3 Windows'
          test/visual/v3_visual_acceptance_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-windows-900x700-linux-${{ github.sha }}
          path: test/visual/goldens/v3_windows_*.png
          if-no-files-found: error
          retention-days: 14

  windows-native:
    name: V3 Windows 900x700 (Native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - shell: pwsh
        run: New-Item -ItemType Directory -Force test/visual/goldens | Out-Null
      - name: Render V3 Windows light/dark snapshots
        run: >-
          flutter test
          --dart-define=LITCHI_VISUAL_SNAPSHOTS=true
          --update-goldens
          --name "V3 Windows"
          test/visual/v3_visual_acceptance_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-windows-900x700-native-${{ github.sha }}
          path: test/visual/goldens/v3_windows_*.png
          if-no-files-found: error
          retention-days: 14

  android-compact:
    name: V3 Android 360-390 compact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: mkdir -p test/visual/goldens
      - name: Render V3 Android light/dark snapshots and 360 smoke
        run: >-
          flutter test
          --dart-define=LITCHI_VISUAL_SNAPSHOTS=true
          --update-goldens
          --name 'V3 Android'
          test/visual/v3_visual_acceptance_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-android-360-390-${{ github.sha }}
          path: test/visual/goldens/v3_android_*.png
          if-no-files-found: error
          retention-days: 14
