name: Visual Acceptance Snapshots

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - redesign/litchi-greenfield-settings-v2
      - redesign/litchi-visual-acceptance-v2
    paths:
      - 'lib/features/dashboard/**'
      - 'lib/shared/theme/**'
      - 'test/visual/**'
      - '.github/workflows/visual-acceptance.yml'

concurrency:
  group: visual-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-dashboard-fallback:
    # Render the production Windows presentation contract on an Ubuntu runner.
    # The test forces TargetPlatform.windows, so AppPlatform/AppShellSpec still
    # execute the Windows UI path while avoiding hosted Windows runner scarcity.
    name: Windows-layout Dashboard 900x700 (Linux fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Prepare snapshot directory
        run: mkdir -p test/visual/goldens
      - name: Render light and dark dashboard snapshots
        run: >-
          flutter test
          --dart-define=LITCHI_VISUAL_SNAPSHOTS=true
          --update-goldens
          test/visual/dashboard_visual_acceptance_test.dart
      - name: Upload dashboard snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-windows-layout-900x700-linux-fallback
          path: test/visual/goldens/*.png
          if-no-files-found: error
          retention-days: 14

  windows-dashboard:
    # Native Windows confirmation. Linux fallback above remains the primary
    # visual artifact if GitHub cannot allocate a hosted Windows runner.
    name: Windows Dashboard 900x700 (Native)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Prepare snapshot directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force test/visual/goldens | Out-Null
      - name: Render light and dark dashboard snapshots
        run: >-
          flutter test
          --dart-define=LITCHI_VISUAL_SNAPSHOTS=true
          --update-goldens
          test/visual/dashboard_visual_acceptance_test.dart
      - name: Upload dashboard snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-windows-900x700-native
          path: test/visual/goldens/*.png
          if-no-files-found: error
          retention-days: 14
