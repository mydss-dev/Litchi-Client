name: V3 Compact Layout Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v3-compact-layout-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Make flex cards finitely sized in scrollable compact layouts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'lib/v3/pages/v3_dashboard_page.dart': [('constraints: const BoxConstraints(minHeight: 292),', 'height: 292,')],
              'lib/v3/pages/v3_shop_page.dart': [('constraints: const BoxConstraints(minHeight: 330),', 'height: 330,')],
              'lib/v3/pages/v3_account_page.dart': [('constraints: const BoxConstraints(minHeight: 230),', 'height: 230,')],
              'lib/v3/pages/v3_invite_page.dart': [('constraints: const BoxConstraints(minHeight: 340),', 'height: 340,')],
              'lib/v3/pages/v3_traffic_page.dart': [('constraints: const BoxConstraints(minHeight: 270),', 'height: 270,')],
          }
          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected layout contract not found in {file_name}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          dart format lib/v3/pages/v3_dashboard_page.dart lib/v3/pages/v3_shop_page.dart lib/v3/pages/v3_account_page.dart lib/v3/pages/v3_invite_page.dart lib/v3/pages/v3_traffic_page.dart
      - run: flutter pub get
      - name: V3 Android 360 compact smoke
        shell: bash
        run: |
          set -o pipefail
          flutter test -r expanded --name 'V3 Android 360x800' test/visual/v3_visual_acceptance_test.dart 2>&1 | tee v3-compact.log
      - name: Upload compact diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-compact-log-${{ github.sha }}
          path: v3-compact.log
          if-no-files-found: warn
          retention-days: 3
      - name: Full Flutter tests
        run: flutter test
      - name: Flutter analyze
        run: flutter analyze
      - name: Commit verified compact fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v3-compact-layout-fix.yml
          rm -f .github/workflows/v3-cleanup-diagnose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(v3): stabilize compact card layouts'
          git push origin HEAD:main
