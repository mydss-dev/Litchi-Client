name: Windows TUN Architecture Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-tun:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.7'
      - run: flutter pub get
      - name: Verify Dart formatting
        shell: pwsh
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter test
      - run: flutter analyze
      - name: Test sing-box bridge on Windows
        working-directory: core/singbox
        shell: pwsh
        run: |
          go mod download
          go test -tags "with_clash_api,with_quic,with_utls,with_wireguard" ./...
      - name: Build isolated Windows core
        shell: pwsh
        run: .\tool\build_singbox_desktop.ps1 -Target windows -Arch amd64
      - name: Build Windows app debug
        shell: pwsh
        run: flutter build windows --debug
      - name: Whitespace check
        shell: bash
        run: git diff --check
