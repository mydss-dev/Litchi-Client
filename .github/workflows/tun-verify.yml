name: Windows TUN Architecture Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-tun:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.7'
      - run: flutter pub get
      - name: Format TUN refactor files for verification
        shell: pwsh
        run: |
          dart format `
            lib/app/core_controller.dart `
            lib/shared/services/clash_api_client.dart `
            lib/shared/services/sing_box_core_manager.dart `
            lib/shared/services/windows_core_process_manager.dart `
            lib/shared/services/windows_tun_service_manager.dart
          git diff -- `
            lib/app/core_controller.dart `
            lib/shared/services/clash_api_client.dart `
            lib/shared/services/sing_box_core_manager.dart `
            lib/shared/services/windows_core_process_manager.dart `
            lib/shared/services/windows_tun_service_manager.dart
      - run: flutter test
      - run: flutter analyze
      - name: Test sing-box bridge on Windows
        working-directory: core/singbox
        shell: pwsh
        run: |
          go mod download
          go test -tags "with_clash_api,with_quic,with_utls,with_wireguard" ./...
      - name: Build isolated Windows core
        shell: pwsh
        run: .\tool\build_singbox_desktop.ps1 -Target windows -Arch amd64
      - name: Smoke-test Windows core
        shell: pwsh
        run: |
          $version = & .\runtime\singbox\windows-amd64\litchi-core.exe version
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace("$version")) {
            throw 'litchi-core.exe version smoke test failed'
          }
          Write-Host "core version: $version"
      - name: Build Windows app release
        shell: pwsh
        run: flutter build windows --release
      - name: Bundle isolated Windows runtime
        shell: pwsh
        run: .\tool\bundle_windows_singbox.ps1 -ReleaseDir "build\windows\x64\runner\Release"
      - name: Verify release runtime layout
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          foreach ($required in @('Client.exe', 'litchi-core.exe', 'wintun.dll')) {
            $path = Join-Path $release $required
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing Windows release runtime: $required"
            }
          }
          foreach ($legacy in @('litchi_singbox.dll', 'core\litchi_singbox.dll')) {
            if (Test-Path -LiteralPath (Join-Path $release $legacy)) {
              throw "Legacy in-process Windows core must not ship: $legacy"
            }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: .\tool\install_inno_chinese.ps1
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }
          & $iscc `
            /DMyAppVersion=0.0.0 `
            /DMyAppName=Litchi `
            /DMyAppPublisher=Litchi `
            /DMyAppExeName=Client.exe `
            /DMyOutputBaseFilename=Litchi-tun-verify `
            litchi_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "installer_output\Litchi-tun-verify.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw 'Windows TUN verification installer was not produced'
          }
          $size = (Get-Item -LiteralPath $installer).Length
          if ($size -le 0) {
            throw 'Windows TUN verification installer is empty'
          }
          Write-Host "installer verified: $installer ($size bytes)"
      - name: Whitespace check
        shell: bash
        run: git diff --check
