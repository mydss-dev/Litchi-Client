name: Android Emulator Host Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/build_libbox_android.sh'
      - 'tool/core_versions.env'
      - 'tool/prepare_brand_assets.dart'
      - 'tool/apply_branding.dart'
      - '.github/workflows/android-emulator-smoke.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/build_libbox_android.sh'
      - 'tool/core_versions.env'
      - 'tool/prepare_brand_assets.dart'
      - 'tool/apply_branding.dart'
      - '.github/workflows/android-emulator-smoke.yml'

concurrency:
  group: android-emulator-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-emulator-host:
    name: Android 15 Host Launch + Insets
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PACKAGE_ID: com.litchi.client
      AVD_NAME: litchi_api35
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.7'
          cache: true
          cache-dependency-path: core/singbox/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Install Android host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'emulator' \
            'ndk;28.0.13004108' \
            "$SYSTEM_IMAGE"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.android/avd"
          echo "ANDROID_AVD_HOME=$GITHUB_WORKSPACE/.android/avd" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Prepare fallback Litchi brand assets
        run: |
          dart run tool/prepare_brand_assets.dart
          dart run tool/apply_branding.dart --app-name=Litchi --metadata-only
          dart run flutter_launcher_icons
      - name: Build pinned sing-box libbox AAR
        run: |
          bash tool/build_libbox_android.sh
          test -s android/app/libs/libbox.aar
          unzip -l android/app/libs/libbox.aar | grep -q 'jni/x86_64/libbox.so'
      - name: Build emulator-compatible debug APK
        run: |
          flutter build apk --debug
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/x86_64/libbox.so'
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '::warning::/dev/kvm is unavailable; emulator will use software acceleration'
          fi
      - name: Create Android 15 AVD
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/build/emulator-smoke"
          mkdir -p "$evidence" "$ANDROID_AVD_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" | tee "$evidence/android-paths.txt"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" | tee -a "$evidence/android-paths.txt"
          echo "HOME=$HOME" | tee -a "$evidence/android-paths.txt"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed > "$evidence/sdkmanager-installed.txt" 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device > "$evidence/avdmanager-devices.txt" 2>&1
          rm -rf "$ANDROID_AVD_HOME/$AVD_NAME.avd" "$ANDROID_AVD_HOME/$AVD_NAME.ini"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name "$AVD_NAME" \
            --package "$SYSTEM_IMAGE" \
            --device 'pixel_6' \
            -p "$ANDROID_AVD_HOME/$AVD_NAME.avd" \
            2>&1 | tee "$evidence/avdmanager-create.log"
          find "$GITHUB_WORKSPACE/.android" -maxdepth 3 -type f -o -type d | sort > "$evidence/avd-files.txt" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd > "$evidence/avdmanager-list.txt" 2>&1 || true
          "$ANDROID_HOME/emulator/emulator" -list-avds 2>&1 | tee "$evidence/avd-list.txt"
          if [ ! -f "$ANDROID_AVD_HOME/$AVD_NAME.ini" ]; then
            echo "::error::AVD ini was not created at $ANDROID_AVD_HOME/$AVD_NAME.ini"
            cat "$evidence/avdmanager-create.log" || true
            cat "$evidence/avdmanager-list.txt" || true
            cat "$evidence/avd-files.txt" || true
            exit 1
          fi
          test -d "$ANDROID_AVD_HOME/$AVD_NAME.avd"
          grep -Fxq "$AVD_NAME" "$evidence/avd-list.txt" || {
            echo "::error::Emulator cannot discover AVD $AVD_NAME"
            exit 1
          }
      - name: Boot headless emulator
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/build/emulator-smoke"
          mkdir -p "$evidence"
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee "$evidence/emulator-version.txt"
          "$ANDROID_HOME/emulator/emulator" -list-avds 2>&1 | tee "$evidence/avd-list.txt"
          command -v adb | tee "$evidence/adb-path.txt"
          adb version | tee -a "$evidence/adb-path.txt"
          adb start-server
          adb devices -l | tee "$evidence/adb-before-boot.txt"
          "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu software \
            -camera-back none \
            -camera-front none \
            > "$evidence/emulator.log" 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > "$evidence/emulator.pid"
          booted=0
          for i in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              set +e
              wait "$emulator_pid"
              emulator_rc=$?
              set -e
              echo "Emulator exit code: $emulator_rc" | tee "$evidence/emulator-exit.txt"
              echo '::error::Emulator exited before Android completed booting'
              cat "$evidence/emulator.log" || true
              adb devices -l | tee "$evidence/adb-devices.txt" || true
              exit 1
            fi
            if adb get-state >/dev/null 2>&1 && [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then
              booted=1
              break
            fi
            sleep 2
          done
          if [ "$booted" != '1' ]; then
            echo '::error::Android emulator boot timed out'
            cat "$evidence/emulator.log" || true
            adb devices -l | tee "$evidence/adb-devices.txt" || true
            adb shell getprop > "$evidence/getprop.txt" 2>/dev/null || true
            exit 1
          fi
          adb devices -l | tee "$evidence/adb-devices.txt"
          adb shell getprop > "$evidence/getprop.txt"
          adb shell wm size > "$evidence/wm-size-default.txt"
          adb shell wm density > "$evidence/wm-density-default.txt"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size 1073x2321
          adb shell wm density 440
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell settings put system user_rotation 0 || true
      - name: Install and launch Litchi
        run: |
          adb logcat -c
          adb install -r build/app/outputs/flutter-apk/app-debug.apk
          adb shell monkey -p "$PACKAGE_ID" -c android.intent.category.LAUNCHER 1
          sleep 8
          pid="$(adb shell pidof "$PACKAGE_ID" | tr -d '\r')"
          test -n "$pid"
          echo "Litchi PID: $pid"
      - name: Capture host-level evidence
        run: |
          set -euo pipefail
          evidence=build/emulator-smoke
          mkdir -p "$evidence"
          adb devices -l | tee "$evidence/adb-before-capture.txt"
          capture() {
            local label="$1" output="$2"
            shift 2
            local attempt result
            for attempt in 1 2 3; do
              echo "Capture [$label] attempt $attempt/3: adb $*"
              if timeout 45s adb "$@" > "$output" 2> "$evidence/$label-stderr.txt"; then
                echo "Capture [$label] OK: $(wc -c < "$output") bytes"
                return 0
              else
                result=$?
                echo "::warning::Capture [$label] failed with exit $result (attempt $attempt/3)"
                cat "$evidence/$label-stderr.txt" || true
                adb devices -l || true
                sleep 3
              fi
            done
            echo "::error::Capture [$label] failed after three attempts"
            tail -n 60 "$evidence/emulator.log" || true
            return 1
          }
          capture screenshot "$evidence/launch-logical-390x844.png" exec-out screencap -p
          test -s "$evidence/launch-logical-390x844.png"
          capture wm-size "$evidence/wm-size.txt" shell wm size
          capture wm-density "$evidence/wm-density.txt" shell wm density
          capture window "$evidence/window.txt" shell dumpsys window
          capture activity-top "$evidence/activity-top.txt" shell dumpsys activity top
          capture display "$evidence/display.txt" shell dumpsys display
          # The unbounded dump intermittently returned 255 after writing partial logs.
          # Limit output and retry instead of failing the whole UI smoke on a transient ADB error.
          capture logcat "$evidence/logcat.txt" logcat -d -t 3000
          test -s "$evidence/logcat.txt"
      - name: Check startup crash and Android back behavior
        run: |
          if grep -A 30 -B 2 -F 'FATAL EXCEPTION' build/emulator-smoke/logcat.txt | grep -Fq "Process: $PACKAGE_ID"; then
            echo '::error::Litchi crashed during Android host smoke'
            grep -A 30 -B 2 -F 'FATAL EXCEPTION' build/emulator-smoke/logcat.txt || true
            exit 1
          fi
          adb shell input keyevent KEYCODE_BACK
          sleep 2
          adb shell monkey -p "$PACKAGE_ID" -c android.intent.category.LAUNCHER 1
          sleep 4
          test -n "$(adb shell pidof "$PACKAGE_ID" | tr -d '\r')"
          adb exec-out screencap -p > build/emulator-smoke/relaunch-after-back.png
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litchi-android-emulator-api35-${{ github.sha }}
          path: build/emulator-smoke/
          if-no-files-found: warn
          retention-days: 7
