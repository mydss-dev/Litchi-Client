name: Cleanup merged redesign branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-redesign-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Delete merged redesign branches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin 'refs/heads/redesign/*' \
              | awk -F'refs/heads/' '{print $2}' \
              | sort
          )

          echo "Found ${#branches[@]} redesign branches"
          printf '%s\n' "${branches[@]}"

          if (( ${#branches[@]} > 0 )); then
            git push origin --delete "${branches[@]}"
          fi

          remaining="$(git ls-remote --heads origin 'refs/heads/redesign/*')"
          if [[ -n "$remaining" ]]; then
            echo '::error::Some redesign branches still remain'
            echo "$remaining"
            exit 1
          fi
