name: Dispatch v1.1.4 CI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-v1.1.4-ci.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI on v1.1.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo mydss-dev/Litchi-Client --ref v1.1.4
