name: White Label Build

on:
  workflow_dispatch:
    inputs:
      app_id:
        required: true
        type: string
      platform:
        required: true
        type: choice
        options: [windows, macos, android]
      version:
        required: true
        type: string
      remote_config_url:
        required: true
        type: string
      remote_config_verifier:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ inputs.app_id }} ${{ inputs.platform }} v${{ inputs.version }}
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || inputs.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch OSS config
        run: |
          curl -sSL "${{ inputs.remote_config_url }}" -o /tmp/config_raw.json
          # If the response is a signed wrapper, extract the payload
          node -e "
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('/tmp/config_raw.json','utf8'));
            if (raw.payload_b64 && raw.signature) {
              fs.writeFileSync('/tmp/config.json', Buffer.from(raw.payload_b64, 'base64url').toString('utf8'));
            } else {
              fs.writeFileSync('/tmp/config.json', JSON.stringify(raw));
            }
          "

      - name: Read config values
        id: config
        run: |
          APP_NAME=$(node -e "console.log(require('/tmp/config.json').app_name || 'Litchi')")
          LOGO_URL=$(node -e "console.log(require('/tmp/config.json').logo_url || '')")
          API_BASE=$(node -e "console.log(require('/tmp/config.json').api_base_list?.[0] || require('/tmp/config.json').api_base || '')")
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "logo_url=$LOGO_URL" >> $GITHUB_OUTPUT
          echo "api_base=$API_BASE" >> $GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build ${{ inputs.platform }}
        run: |
          flutter build ${{ inputs.platform }} --release \
            --dart-define=APP_NAME="${{ steps.config.outputs.app_name }}" \
            --dart-define=LOGO_URL="${{ steps.config.outputs.logo_url }}" \
            --dart-define=API_BASE="${{ steps.config.outputs.api_base }}" \
            --dart-define=APP_VERSION="${{ inputs.version }}"

      - name: Rename artifact
        shell: bash
        run: |
          APP="${{ steps.config.outputs.app_name }}"
          VER="${{ inputs.version }}"
          mkdir -p release
          case "${{ inputs.platform }}" in
            windows)
              cp build/windows/x64/runner/Release/*.exe "release/$APP $VER.exe" 2>/dev/null || true
              ;;
            macos)
              cp -R "build/macos/Build/Products/Release/"*.app "release/" 2>/dev/null || true
              hdiutil create -volname "$APP" -srcfolder release -ov -format UDZO "$APP $VER.dmg" 2>/dev/null || true
              ;;
            android)
              cp build/app/outputs/flutter-apk/app-release.apk "release/$APP $VER.apk" 2>/dev/null || true
              ;;
          esac

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_id }}-${{ inputs.platform }}-${{ inputs.version }}
          path: release/*
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
