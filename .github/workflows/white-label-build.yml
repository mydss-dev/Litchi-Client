name: White Label Build

on:
  workflow_dispatch:
    inputs:
      app_id:
        required: true
        type: string
      platform:
        required: true
        type: choice
        options: [windows, macos, android]
      version:
        required: true
        type: string
      remote_config_url:
        required: true
        type: string
      remote_config_verifier:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ inputs.app_id }} ${{ inputs.platform }} v${{ inputs.version }}
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || inputs.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch OSS config
        id: fetch
        run: |
          node -e "
            const https = require('https');
            const os = require('os');
            const fs = require('fs');
            const url = '${{ inputs.remote_config_url }}';
            const tmp = os.tmpdir();
            https.get(url, (res) => {
              let data = '';
              res.on('data', (chunk) => data += chunk);
              res.on('end', () => {
                const raw = JSON.parse(data);
                let payload;
                if (raw.payload_b64 && raw.signature) {
                  payload = JSON.parse(Buffer.from(raw.payload_b64, 'base64url').toString('utf8'));
                } else {
                  payload = raw;
                }
                const out = JSON.stringify(payload);
                fs.writeFileSync(tmp + '/config.json', out);
                // Also write flattened values for GitHub Output
                const p = JSON.parse(out);
                const app = p.app_name || 'Litchi';
                const logo = p.logo_url || '';
                const api = p.api_base_list?.[0] || p.api_base || '';
                fs.appendFileSync(process.env.GITHUB_OUTPUT, 'app_name=' + app + '\n');
                fs.appendFileSync(process.env.GITHUB_OUTPUT, 'logo_url=' + logo + '\n');
                fs.appendFileSync(process.env.GITHUB_OUTPUT, 'api_base=' + api + '\n');
              });
            }).on('error', (e) => { console.error(e); process.exit(1); });
          "

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build ${{ inputs.platform }}
        shell: bash
        run: |
          case "${{ inputs.platform }}" in
            android)
              flutter build apk --release \
                --dart-define=APP_NAME="${{ steps.fetch.outputs.app_name }}" \
                --dart-define=LOGO_URL="${{ steps.fetch.outputs.logo_url }}" \
                --dart-define=API_BASE="${{ steps.fetch.outputs.api_base }}" \
                --dart-define=APP_VERSION="${{ inputs.version }}"
              ;;
            *)
              flutter build ${{ inputs.platform }} --release \
                --dart-define=APP_NAME="${{ steps.fetch.outputs.app_name }}" \
                --dart-define=LOGO_URL="${{ steps.fetch.outputs.logo_url }}" \
                --dart-define=API_BASE="${{ steps.fetch.outputs.api_base }}" \
                --dart-define=APP_VERSION="${{ inputs.version }}"
              ;;
          esac

      # ── Windows: sing-box + wintun + rule sets ─────────────────────────
      - name: Bundle sing-box (Windows)
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/latest" -Headers @{ "User-Agent"="litchi-ci"; "Authorization"="Bearer $env:GITHUB_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -match "windows-amd64\.zip$" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile singbox.zip
          Expand-Archive singbox.zip -DestinationPath singbox-tmp
          $exe = Get-ChildItem -Recurse -Filter "sing-box.exe" singbox-tmp | Select-Object -First 1
          Copy-Item $exe.FullName "build\windows\x64\runner\Release\sing-box.exe"
          Write-Host "sing-box.exe ready"

      - name: Bundle wintun (Windows)
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-tmp
          Copy-Item "wintun-tmp\wintun\bin\amd64\wintun.dll" "build\windows\x64\runner\Release\wintun.dll"

      - name: Bundle rule sets (Windows)
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $rulesDir = "build\windows\x64\runner\Release\rules"
          New-Item -ItemType Directory -Force -Path $rulesDir | Out-Null
          $files = @{
            "geosite-cn.srs"               = "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-cn.srs"
            "geosite-category-ads-all.srs" = "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-category-ads-all.srs"
            "geoip-cn.srs"                 = "https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs"
          }
          foreach ($kv in $files.GetEnumerator()) { Invoke-WebRequest -Uri $kv.Value -OutFile "$rulesDir\$($kv.Key)" }

      # ── macOS: sing-box universal ────────────────────────────────────
      - name: Bundle sing-box (macOS)
        if: inputs.platform == 'macos'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          app="build/macos/Build/Products/Release/litchi_client.app"
          release=$(curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "User-Agent: litchi-ci" https://api.github.com/repos/SagerNet/sing-box/releases/latest)
          amd_url=$(echo "$release" | grep -o 'https://[^"]*darwin-amd64\.tar\.gz' | head -1)
          arm_url=$(echo "$release" | grep -o 'https://[^"]*darwin-arm64\.tar\.gz' | head -1)
          curl -sSL "$amd_url" -o amd.tar.gz && tar -xzf amd.tar.gz
          curl -sSL "$arm_url" -o arm.tar.gz && tar -xzf arm.tar.gz
          amd_bin=$(find . -maxdepth 2 -type f -name sing-box -path '*amd64*' | head -1)
          arm_bin=$(find . -maxdepth 2 -type f -name sing-box -path '*arm64*' | head -1)
          lipo -create "$amd_bin" "$arm_bin" -output sing-box || cp "$arm_bin" sing-box
          chmod +x sing-box
          mkdir -p "$app/Contents/Resources"
          cp sing-box "$app/Contents/Resources/sing-box"
          codesign --force --sign - "$app/Contents/Resources/sing-box"
          codesign --force --deep --sign - "$app"

      # ── Android: libbox AAR ──────────────────────────────────────────
      - uses: actions/setup-java@v4
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        if: inputs.platform == 'android'
        with:
          go-version: stable

      - name: Install Android NDK + gomobile
        if: inputs.platform == 'android'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build libbox AAR (Android)
        if: inputs.platform == 'android'
        run: |
          gomobile init
          dart run tool/build_libbox_android.sh

      - name: Rename artifact
        shell: bash
        run: |
          APP="${{ steps.fetch.outputs.app_name }}"
          VER="${{ inputs.version }}"
          mkdir -p release
          case "${{ inputs.platform }}" in
            windows)
              cp build/windows/x64/runner/Release/*.exe "release/$APP $VER.exe" 2>/dev/null || true
              ;;
            macos)
              cp -R "build/macos/Build/Products/Release/"*.app "release/" 2>/dev/null || true
              hdiutil create -volname "$APP" -srcfolder release -ov -format UDZO "$APP $VER.dmg" 2>/dev/null || true
              ;;
            android)
              cp build/app/outputs/flutter-apk/app-release.apk "release/$APP $VER.apk" 2>/dev/null || true
              ;;
          esac

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_id }}-${{ inputs.platform }}-${{ inputs.version }}
          path: release/*
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
