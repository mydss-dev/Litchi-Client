name: White Label Build
run-name: ${{ inputs.app_id }} ${{ inputs.platform }} v${{ inputs.version }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      app_id:
        required: true
        type: string
      platform:
        required: true
        type: choice
        options: [windows, macos, android]
      version:
        required: true
        type: string
      remote_config_url:
        required: true
        type: string
      remote_config_verifier:
        required: true
        type: string
      request_id:
        required: true
        type: string
      download_base_url:
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || inputs.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      TENANT_ID: ${{ inputs.app_id }}
      BUILD_VERSION: ${{ inputs.version }}
      REMOTE_CONFIG_URL: ${{ inputs.remote_config_url }}
      REMOTE_CONFIG_VERIFIER: ${{ inputs.remote_config_verifier }}
      DOWNLOAD_BASE_URL: ${{ inputs.download_base_url }}
      REQUEST_ID: ${{ inputs.request_id }}
      MIHOMO_VERSION: v1.19.27
      MIHOMO_WINDOWS_AMD64_SHA256: "34b4c5bc0c176eebd298f6624aa23ea41985a2c54efb04eb0e9c4542e45190ee"
      MIHOMO_DARWIN_AMD64_SHA256:  "5392bea435a1c4b0a496571daafa977f744207cfafac18fb78a9b7d0747585c2"
      MIHOMO_DARWIN_ARM64_SHA256:  "3617c9d8a5a55aecfe1ebd0f55ff59f2706c8ad68fd65c6c4e5f7cf2b74263f1"
      WINTUN_VERSION: "0.14.1"
      WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"

    steps:
      - uses: actions/checkout@v4

      - name: Verify signed tenant config
        id: config
        shell: bash
        run: node tool/prepare_white_label_config.mjs

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        if: inputs.platform == 'android'
        with:
          go-version: stable

      - name: Install Android build dependencies
        if: inputs.platform == 'android'
        shell: bash
        run: |
          # sdkmanager closes stdin after accepting all licenses, so `yes`
          # normally exits with SIGPIPE. The following NDK install is the
          # authoritative success check.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Configure Android signing
        if: inputs.platform == 'android'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Android white-label builds require all ANDROID_KEYSTORE_* repository secrets"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Configure macOS bundle identity
        if: inputs.platform == 'macos'
        shell: bash
        env:
          BUNDLE_ID: ${{ steps.config.outputs.macos_bundle_id }}
        run: |
          sed -i '' "s/^PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID/" \
            macos/Runner/Configs/AppInfo.xcconfig

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Generate tenant branding and platform icons
        shell: bash
        env:
          CONFIG_PATH: ${{ steps.config.outputs.config_path }}
          LOGO_URL: ${{ steps.config.outputs.logo_url }}
        run: |
          dart run tool/prepare_brand_assets.dart
          dart run tool/apply_branding.dart "$CONFIG_PATH" --metadata-only
          dart run flutter_launcher_icons

      - name: Build tenant package
        shell: bash
        env:
          APP_NAME: ${{ steps.config.outputs.app_name }}
          LOGO_URL: ${{ steps.config.outputs.logo_url }}
          API_BASE: ${{ steps.config.outputs.api_base }}
          ANDROID_APPLICATION_ID: ${{ steps.config.outputs.android_application_id }}
          VERSION_CODE: ${{ steps.config.outputs.version_code }}
        run: |
          defines=(
            "--dart-define=APP_NAME=$APP_NAME"
            "--dart-define=LOGO_URL=$LOGO_URL"
            "--dart-define=API_BASE=$API_BASE"
            "--dart-define=APP_VERSION=$BUILD_VERSION"
            "--dart-define=REMOTE_CONFIG_URL=$REMOTE_CONFIG_URL"
            "--dart-define=REMOTE_CONFIG_PUBLIC_KEY=$REMOTE_CONFIG_VERIFIER"
          )
          case "${{ inputs.platform }}" in
            android)
              flutter build apk --release \
                "--build-name=$BUILD_VERSION" \
                "--build-number=$VERSION_CODE" \
                "${defines[@]}"
              ;;
            *)
              flutter build "${{ inputs.platform }}" --release \
                "--build-name=$BUILD_VERSION" \
                "${defines[@]}"
              ;;
          esac

      - name: Bundle Windows runtime
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $version = $env:MIHOMO_VERSION
          $name = "mihomo-windows-amd64-$version.zip"
          $url = "https://github.com/MetaCubeX/mihomo/releases/download/$version/$name"
          Write-Host "Downloading $name"
          Invoke-WebRequest -Uri $url -OutFile mihomo.zip
          $actual = (Get-FileHash mihomo.zip -Algorithm SHA256).Hash.ToLower()
          $expected = $env:MIHOMO_WINDOWS_AMD64_SHA256.ToLower()
          if ($actual -ne $expected) {
            throw "mihomo windows sha256 mismatch: actual=$actual expected=$expected"
          }
          Write-Host "mihomo windows sha256 verified"
          Expand-Archive mihomo.zip -DestinationPath mihomo-tmp
          $exe = Get-ChildItem -Recurse -Filter "mihomo*.exe" mihomo-tmp | Select-Object -First 1
          if (-not $exe) { throw "mihomo.exe missing from downloaded archive" }
          Copy-Item $exe.FullName "$releaseDir\mihomo.exe"

          $wintunVersion = $env:WINTUN_VERSION
          $wintunUrl = "https://www.wintun.net/builds/wintun-$wintunVersion.zip"
          Write-Host "Downloading wintun $wintunVersion"
          Invoke-WebRequest -Uri $wintunUrl -OutFile wintun.zip
          $actualWintun = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          $expectedWintun = $env:WINTUN_SHA256.ToLower()
          if ($actualWintun -ne $expectedWintun) {
            throw "wintun sha256 mismatch: actual=$actualWintun expected=$expectedWintun"
          }
          Write-Host "wintun sha256 verified"
          Expand-Archive wintun.zip -DestinationPath wintun-tmp
          Copy-Item "wintun-tmp\wintun\bin\amd64\wintun.dll" "$releaseDir\wintun.dll"

      - name: Bundle macOS core
        if: inputs.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/litchi_client.app"
          version="$MIHOMO_VERSION"
          amd_name="mihomo-darwin-amd64-$version.gz"
          arm_name="mihomo-darwin-arm64-$version.gz"
          amd_url="https://github.com/MetaCubeX/mihomo/releases/download/$version/$amd_name"
          arm_url="https://github.com/MetaCubeX/mihomo/releases/download/$version/$arm_name"
          echo "mihomo version: $version"
          echo "amd64: $amd_url"
          echo "arm64: $arm_url"
          curl --fail --silent --show-error --location "$amd_url" -o mihomo-amd64.gz
          curl --fail --silent --show-error --location "$arm_url" -o mihomo-arm64.gz
          actual_amd=$(shasum -a 256 mihomo-amd64.gz | awk '{print $1}')
          if [ "$actual_amd" != "$MIHOMO_DARWIN_AMD64_SHA256" ]; then
            echo "::error::mihomo darwin amd64 sha256 mismatch: actual=$actual_amd expected=$MIHOMO_DARWIN_AMD64_SHA256"
            exit 1
          fi
          actual_arm=$(shasum -a 256 mihomo-arm64.gz | awk '{print $1}')
          if [ "$actual_arm" != "$MIHOMO_DARWIN_ARM64_SHA256" ]; then
            echo "::error::mihomo darwin arm64 sha256 mismatch: actual=$actual_arm expected=$MIHOMO_DARWIN_ARM64_SHA256"
            exit 1
          fi
          echo "mihomo darwin sha256 verified"
          gunzip mihomo-amd64.gz
          gunzip mihomo-arm64.gz
          lipo -create mihomo-amd64 mihomo-arm64 -output mihomo
          chmod +x mihomo
          cp mihomo "$app/Contents/Resources/mihomo"
          codesign --force --sign - "$app/Contents/Resources/mihomo"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

      - name: Verify Android native core
        if: inputs.platform == 'android'
        shell: bash
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -q "lib/arm64-v8a/liblitchi_mihomo.so" || {
            echo "::error::APK does not contain mihomo arm64-v8a"
            exit 1
          }

      - name: Build Windows installer
        if: inputs.platform == 'windows'
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ steps.config.outputs.package_name }}
          INSTALLER_APP_ID: ${{ steps.config.outputs.android_application_id }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          choco install innosetup --no-progress -y
          $outputName = "$env:PACKAGE_NAME $env:BUILD_VERSION Windows Setup"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppId=$env:INSTALLER_APP_ID" `
            "/DMyAppName=$env:PACKAGE_NAME" `
            "/DMyAppPublisher=$env:PACKAGE_NAME" `
            "/DMyAppVersion=$env:BUILD_VERSION" `
            "/DMyOutputDir=release" `
            "/DMyOutputBaseFilename=$outputName" `
            litchi_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "release\$outputName.exe"
          if (-not (Test-Path $installer)) { throw "Windows installer was not created" }

      - name: Package macOS artifact
        if: inputs.platform == 'macos'
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.config.outputs.package_name }}
        run: |
          set -euo pipefail
          mkdir -p release dmg-stage
          cp -R "build/macos/Build/Products/Release/litchi_client.app" \
            "dmg-stage/$PACKAGE_NAME.app"
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "$PACKAGE_NAME" -srcfolder dmg-stage \
            -ov -format UDZO "release/$PACKAGE_NAME $BUILD_VERSION macOS.dmg"

      - name: Package Android artifact
        if: inputs.platform == 'android'
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.config.outputs.package_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release/$PACKAGE_NAME $BUILD_VERSION Android.apk"

      - name: Upload package to Cloudflare R2
        if: inputs.download_base_url != ''
        id: r2
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -m pip install --disable-pip-version-check --quiet boto3
          python tool/upload_r2.py release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_id }}-${{ inputs.platform }}-${{ inputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
