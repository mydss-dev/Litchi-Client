name: Repair Windows TUN Refactor Workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-windows-tun-workflow.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Repair and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/windows-tun-refactor.yml')
          text = p.read_text()
          old = "needs.windows-verify.result == 'success'"
          new = "needs['windows-verify'].result == 'success'"
          if old not in text:
              raise SystemExit('workflow expression anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-windows-tun-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/windows-tun-refactor.yml
          git commit -m "chore: repair Windows TUN refactor workflow"
          git push origin HEAD:main
