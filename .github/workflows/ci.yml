name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

# Required so softprops/action-gh-release can create/update the GitHub Release
# on v* tags (the default workflow token is read-only otherwise → 403).
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.7'
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze
      - name: Test sing-box desktop bridge
        working-directory: core/singbox
        run: |
          go mod download
          go test -tags "with_clash_api,with_quic,with_utls,with_wireguard" ./...

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.7'

      - run: flutter pub get

      - name: Resolve release config
        id: config
        shell: pwsh
        run: |
          function Test-Ed25519Key {
            param([string]$Key)
            if ([string]::IsNullOrWhiteSpace($Key)) { return $false }
            $b64 = $Key.Trim().Replace('-', '+').Replace('_', '/')
            switch ($b64.Length % 4) {
              2 { $b64 += '==' }
              3 { $b64 += '=' }
            }
            try {
              $bytes = [Convert]::FromBase64String($b64)
              return ($bytes.Length -eq 32)
            } catch { return $false }
          }

          $cdnBase = "${{ vars.CDN_BASE_URL }}".Trim()
          $configUrl = if ($cdnBase) { $cdnBase.TrimEnd('/') + '/config.json' } else { '' }
          $configKey = "${{ vars.REMOTE_CONFIG_PUBLIC_KEY }}"
          $updateKey = "${{ vars.UPDATE_PUBLIC_KEY }}"

          if ("${{ github.ref }}" -like 'refs/tags/v*') {
            if ([string]::IsNullOrWhiteSpace($cdnBase)) {
              throw 'Tagged releases require vars.CDN_BASE_URL'
            }
            if ($cdnBase -notmatch '^https://') {
              throw 'vars.CDN_BASE_URL must be an absolute HTTPS URL'
            }
            if (-not (Test-Ed25519Key $configKey)) {
              throw 'vars.REMOTE_CONFIG_PUBLIC_KEY must be a 32-byte base64url Ed25519 public key'
            }
          }

          "config_url=$configUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "config_key=$configKey" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "update_key=$updateKey" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate brand assets from signed config
        id: branding
        shell: pwsh
        run: |
          $configUrl = "${{ steps.config.outputs.config_url }}".Trim()
          $configKey = "${{ steps.config.outputs.config_key }}".Trim()
          $prevConfigKey = "${{ vars.REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY }}".Trim()
          if ($configUrl -and $configKey) {
            $args = @('run', 'tool/apply_branding.dart', $configUrl, "--public-key=$configKey")
            if ($prevConfigKey) { $args += "--public-key=$prevConfigKey" }
            & dart @args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            dart run tool/prepare_brand_assets.dart
            dart run tool/apply_branding.dart '--app-name=Litchi' --metadata-only
            dart run flutter_launcher_icons
          }

      - name: Build release
        shell: pwsh
        run: |
          $configUrl = "${{ steps.config.outputs.config_url }}"
          $configKey = "${{ steps.config.outputs.config_key }}"
          $prevConfigKey = if ("${{ vars.REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY }}") { "${{ vars.REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY }}" } else { "" }
          $updateKey = "${{ steps.config.outputs.update_key }}"
          $prevUpdateKey = if ("${{ vars.UPDATE_PREVIOUS_PUBLIC_KEY }}") { "${{ vars.UPDATE_PREVIOUS_PUBLIC_KEY }}" } else { "" }
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" }
          flutter build windows --release `
            "--build-name=$version" `
            "--dart-define=APP_VERSION=$version" `
            "--dart-define=REMOTE_CONFIG_URL=$configUrl" `
            "--dart-define=REMOTE_CONFIG_PUBLIC_KEY=$configKey" `
            "--dart-define=REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY=$prevConfigKey" `
            "--dart-define=UPDATE_PUBLIC_KEY=$updateKey" `
            "--dart-define=UPDATE_PREVIOUS_PUBLIC_KEY=$prevUpdateKey"

      - name: Bundle Windows runtime
        shell: pwsh
        run: .\tool\bundle_windows_singbox.ps1 -ReleaseDir "build\windows\x64\runner\Release"

      - name: Apply branded Windows executable name
        shell: pwsh
        env:
          WINDOWS_EXE_NAME: ${{ steps.branding.outputs.windows_exe_name }}
        run: |
          $source = "build\windows\x64\runner\Release\Client.exe"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Windows executable is missing: $source"
          }
          Rename-Item -LiteralPath $source -NewName $env:WINDOWS_EXE_NAME

      - name: Install Inno Setup
        shell: pwsh
        run: .\tool\install_inno_chinese.ps1

      - name: Build installer
        shell: pwsh
        env:
          APP_NAME: ${{ steps.branding.outputs.app_name }}
          WINDOWS_EXE_NAME: ${{ steps.branding.outputs.windows_exe_name }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" }
          $appName = if ($env:APP_NAME) { $env:APP_NAME } else { 'Litchi' }
          $publisher = $appName
          $setupName = "$appName-Setup-$version.exe"
          Write-Host "Building installer: $appName $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$version `
            "/DMyAppName=$appName" `
            "/DMyAppPublisher=$publisher" `
            "/DMyAppExeName=$env:WINDOWS_EXE_NAME" `
            litchi_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Installer ready: installer_output\$setupName"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litchi-client-windows-${{ github.sha }}
          path: installer_output\*.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: installer_output\*.exe
          generate_release_notes: true

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.7'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Resolve release config
        id: config
        run: |
          decode_len() {
            local s="$1"
            s="${s//-/+}"; s="${s//_//}"
            case $((${#s} % 4)) in
              2) s="${s}==";;
              3) s="${s}=";;
            esac
            printf '%s' "$s" | base64 -d 2>/dev/null | wc -c
          }
          cdn_base="${{ vars.CDN_BASE_URL }}"
          config_url=""
          if [ -n "$cdn_base" ]; then config_url="${cdn_base%/}/config.json"; fi
          config_key="${{ vars.REMOTE_CONFIG_PUBLIC_KEY }}"
          update_key="${{ vars.UPDATE_PUBLIC_KEY }}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ -z "$cdn_base" ]; then
              echo "::error::Tagged releases require vars.CDN_BASE_URL"; exit 1
            fi
            case "$cdn_base" in
              https://*) ;;
              *) echo "::error::vars.CDN_BASE_URL must be an absolute HTTPS URL"; exit 1;;
            esac
            if [ "$(decode_len "$config_key")" != "32" ]; then
              echo "::error::vars.REMOTE_CONFIG_PUBLIC_KEY must be a 32-byte base64url Ed25519 public key"; exit 1
            fi
          fi

          {
            echo "config_url=$config_url"
            echo "config_key=$config_key"
            echo "update_key=$update_key"
          } >> "$GITHUB_OUTPUT"

      - name: Build pinned sing-box libbox AAR
        run: |
          bash tool/build_libbox_android.sh
          test -s android/app/libs/libbox.aar
          unzip -l android/app/libs/libbox.aar | grep -q "jni/arm64-v8a/libbox.so"

      - name: Compile Android Kotlin bridge
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Generate brand assets from signed config
        id: branding
        run: |
          config_url="${{ steps.config.outputs.config_url }}"
          config_key="${{ steps.config.outputs.config_key }}"
          prev_config_key="${{ vars.REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY }}"
          if [ -n "$config_url" ] && [ -n "$config_key" ]; then
            args=(run tool/apply_branding.dart "$config_url" "--public-key=$config_key")
            if [ -n "$prev_config_key" ]; then args+=("--public-key=$prev_config_key"); fi
            dart "${args[@]}"
          else
            dart run tool/prepare_brand_assets.dart
            dart run tool/apply_branding.dart --app-name=Litchi --metadata-only
            dart run flutter_launcher_icons
          fi

      - name: Configure Android signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<'EOF'
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Tagged Android releases require ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets"
            exit 1
          else
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -storepass android-ci-password \
              -keypass android-ci-password \
              -alias android-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Litchi CI,O=Litchi,C=US"
            cat > android/key.properties <<'EOF'
          storeFile=upload-keystore.jks
          storePassword=android-ci-password
          keyAlias=android-ci
          keyPassword=android-ci-password
          EOF
          fi

      - name: Build release APK (universal multi-ABI)
        run: |
          config_url="${{ steps.config.outputs.config_url }}"
          config_key="${{ steps.config.outputs.config_key }}"
          prev_config_key="${{ vars.REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY }}"
          update_key="${{ steps.config.outputs.update_key }}"
          prev_update_key="${{ vars.UPDATE_PREVIOUS_PUBLIC_KEY }}"
          prev_config_key="${prev_config_key:-}"
          prev_update_key="${prev_update_key:-}"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then version="0.0.0"; fi
          IFS='.' read -r major minor patch_extra <<< "$version"
          patch="${patch_extra%%[^0-9]*}"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          version_code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          if [ "$version_code" -le 0 ]; then version_code="${{ github.run_number }}"; fi
          flutter build apk --release \
            "--build-name=$version" \
            "--build-number=$version_code" \
            "--dart-define=APP_VERSION=$version" \
            "--dart-define=REMOTE_CONFIG_URL=$config_url" \
            "--dart-define=REMOTE_CONFIG_PUBLIC_KEY=$config_key" \
            "--dart-define=REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY=$prev_config_key" \
            "--dart-define=UPDATE_PUBLIC_KEY=$update_key" \
            "--dart-define=UPDATE_PREVIOUS_PUBLIC_KEY=$prev_update_key"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/android-universal.apk"
          flutter build apk --release --split-per-abi \
            "--build-name=$version" \
            "--build-number=$version_code" \
            "--dart-define=APP_VERSION=$version" \
            "--dart-define=REMOTE_CONFIG_URL=$config_url" \
            "--dart-define=REMOTE_CONFIG_PUBLIC_KEY=$config_key" \
            "--dart-define=REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY=$prev_config_key" \
            "--dart-define=UPDATE_PUBLIC_KEY=$update_key" \
            "--dart-define=UPDATE_PREVIOUS_PUBLIC_KEY=$prev_update_key"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            flutter build appbundle --release \
              "--build-name=$version" \
              "--build-number=$version_code" \
              "--dart-define=APP_VERSION=$version" \
              "--dart-define=REMOTE_CONFIG_URL=$config_url" \
              "--dart-define=REMOTE_CONFIG_PUBLIC_KEY=$config_key" \
              "--dart-define=REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY=$prev_config_key" \
              "--dart-define=UPDATE_PUBLIC_KEY=$update_key" \
              "--dart-define=UPDATE_PREVIOUS_PUBLIC_KEY=$prev_update_key"
          fi

      - name: Verify the core includes arm64
        run: |
          apk="$RUNNER_TEMP/android-universal.apk"
          if ! unzip -l "$apk" | grep -q "lib/arm64-v8a/libbox.so"; then
            echo "::error::sing-box arm64-v8a library is missing from the APK"
            unzip -l "$apk" | grep "libbox.so" || true
            exit 1
          fi
          echo "sing-box arm64-v8a library is packaged"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            aab="build/app/outputs/bundle/release/app-release.aab"
            if ! unzip -l "$aab" | grep -q "base/lib/arm64-v8a/libbox.so"; then
              echo "::error::sing-box arm64-v8a library is missing from the AAB"
              exit 1
            fi
            echo "sing-box arm64-v8a library is packaged in the AAB"
          fi

      - name: Rename APK
        run: |
          app_name="${{ steps.branding.outputs.app_name }}"
          app_name="${app_name:-Litchi}"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then version="0.0.0"; fi
          cp "$RUNNER_TEMP/android-universal.apk" \
             "build/app/outputs/flutter-apk/$app_name $version.apk"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "build/app/outputs/flutter-apk/$app_name $version arm64.apk"
          rm -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
                build/app/outputs/flutter-apk/app-x86_64-release.apk
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp build/app/outputs/bundle/release/app-release.aab \
              "build/app/outputs/flutter-apk/$app_name $version.aab"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litchi-client-android-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.aab
          generate_release_notes: true

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.7'

      - run: flutter pub get

      - name: Resolve release config
        id: config
        run: |
          decode_len() {
            local s="$1"
            s="${s//-/+}"; s="${s//_//}"
            case $((${#s} % 4)) in
              2) s="${s}==";;
              3) s="${s}=";;
            esac
            printf '%s' "$s" | base64 -d 2>/dev/null | wc -c
          }
          cdn_base="${{ vars.CDN_BASE_URL }}"
          config_url=""
          if [ -n "$cdn_base" ]; then config_url="${cdn_base%/}/config.json"; fi
          config_key="${{ vars.REMOTE_CONFIG_PUBLIC_KEY }}"
          update_key="${{ vars.UPDATE_PUBLIC_KEY }}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ -z "$cdn_base" ]; then
              echo "::error::Tagged releases require vars.CDN_BASE_URL"; exit 1
            fi
            case "$cdn_base" in
              https://*) ;;
              *) echo "::error::vars.CDN_BASE_URL must be an absolute HTTPS URL"; exit 1;;
            esac
            if [ "$(decode_len "$config_key")" != "32" ]; then
              echo "::error::vars.REMOTE_CONFIG_PUBLIC_KEY must be a 32-byte base64url Ed25519 public key"; exit 1
            fi
          fi

          {
            echo "config_url=$config_url"
            echo "config_key=$config_key"
            echo "update_key=$update_key"
          } >> "$GITHUB_OUTPUT"

      - name: Generate brand assets from signed config
        id: branding
        run: |
          config_url="${{ steps.config.outputs.config_url }}"
          config_key="${{ steps.config.outputs.config_key }}"
          prev_config_key="${{ vars.REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY }}"
          if [ -n "$config_url" ] && [ -n "$config_key" ]; then
            args=(run tool/apply_branding.dart "$config_url" "--public-key=$config_key")
            if [ -n "$prev_config_key" ]; then args+=("--public-key=$prev_config_key"); fi
            dart "${args[@]}"
          else
            dart run tool/prepare_brand_assets.dart
            dart run tool/apply_branding.dart --app-name=Litchi --metadata-only
            dart run flutter_launcher_icons
          fi

      - name: Build release
        run: |
          config_url="${{ steps.config.outputs.config_url }}"
          config_key="${{ steps.config.outputs.config_key }}"
          prev_config_key="${{ vars.REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY }}"
          update_key="${{ steps.config.outputs.update_key }}"
          prev_update_key="${{ vars.UPDATE_PREVIOUS_PUBLIC_KEY }}"
          prev_config_key="${prev_config_key:-}"
          prev_update_key="${prev_update_key:-}"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then version="0.0.0"; fi
          flutter build macos --release \
            "--build-name=$version" \
            "--dart-define=APP_VERSION=$version" \
            "--dart-define=REMOTE_CONFIG_URL=$config_url" \
            "--dart-define=REMOTE_CONFIG_PUBLIC_KEY=$config_key" \
            "--dart-define=REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY=$prev_config_key" \
            "--dart-define=UPDATE_PUBLIC_KEY=$update_key" \
            "--dart-define=UPDATE_PREVIOUS_PUBLIC_KEY=$prev_update_key"

      - name: Bundle sing-box core (universal)
        run: bash tool/bundle_macos_singbox.sh "build/macos/Build/Products/Release/Client.app"

      - name: Ad-hoc codesign
        run: |
          app="build/macos/Build/Products/Release/Client.app"
          codesign --force --options runtime --sign - "$app/Contents/Frameworks/liblitchi_singbox.dylib"
          codesign --force --deep --options runtime --sign - \
            --entitlements macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --strict "$app" && echo "codesign ok"

      - name: Build DMG
        run: |
          app="build/macos/Build/Products/Release/Client.app"
          app_name="${{ steps.branding.outputs.app_name }}"
          app_name="${app_name:-Litchi}"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then version="0.0.0"; fi
          dmg="$app_name $version.dmg"
          rm -rf dmg-stage && mkdir -p dmg-stage
          cp -R "$app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "$app_name" -srcfolder dmg-stage \
            -ov -format UDZO "$dmg"
          ls -lh "$dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litchi-client-macos-${{ github.sha }}
          path: "*.dmg"
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: "*.dmg"
          generate_release_notes: true

  # ── Signing + R2 upload moved to .github/workflows/publish.yml ─────────────
  # The Ed25519 update signing private key is only exposed to the
  # environment-protected publish workflow (see tool/KEY_ROTATION.md). It is
  # kept out of this always-running build pipeline.