name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

# Required so softprops/action-gh-release can create/update the GitHub Release
# on v* tags (the default workflow token is read-only otherwise → 403).
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.7'
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze
      - name: Test sing-box desktop bridge
        working-directory: core/singbox
        run: |
          go mod download
          go test -tags "with_clash_api,with_quic,with_utls,with_wireguard" ./...

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.7'

      - run: flutter pub get

      - name: Generate brand assets
        id: branding
        shell: pwsh
        run: |
          $appName = if ("${{ secrets.APP_NAME }}") { "${{ secrets.APP_NAME }}" } else { "Litchi" }
          $env:LOGO_URL = if ("${{ secrets.LOGO_URL }}") { "${{ secrets.LOGO_URL }}" } else { "" }
          dart run tool/prepare_brand_assets.dart
          dart run tool/apply_branding.dart "--app-name=$appName" "--logo-url=$env:LOGO_URL" --metadata-only
          dart run flutter_launcher_icons

      - name: Build release
        shell: pwsh
        run: |
          $apiBase   = if ("${{ secrets.API_BASE }}")  { "${{ secrets.API_BASE }}" }  else { "" }
          $appName   = if ("${{ secrets.APP_NAME }}")  { "${{ secrets.APP_NAME }}" }  else { "Litchi" }
          $logoUrl   = if ("${{ secrets.LOGO_URL }}")  { "${{ secrets.LOGO_URL }}" }  else { "" }
          $configUrl = if ("${{ secrets.REMOTE_CONFIG_URL }}")  { "${{ secrets.REMOTE_CONFIG_URL }}" }  else { "" }
          $configKey = if ("${{ secrets.REMOTE_CONFIG_PUBLIC_KEY }}") { "${{ secrets.REMOTE_CONFIG_PUBLIC_KEY }}" } else { "" }
          $prevConfigKey = if ("${{ secrets.REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY }}") { "${{ secrets.REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY }}" } else { "" }
          $updateKey = if ("${{ secrets.UPDATE_PUBLIC_KEY }}") { "${{ secrets.UPDATE_PUBLIC_KEY }}" } else { "" }
          $prevUpdateKey = if ("${{ secrets.UPDATE_PREVIOUS_PUBLIC_KEY }}") { "${{ secrets.UPDATE_PREVIOUS_PUBLIC_KEY }}" } else { "" }
          $version   = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" }
          if ("${{ github.ref }}" -like "refs/tags/v*" -and [string]::IsNullOrWhiteSpace($apiBase)) {
            throw "Tagged releases require the API_BASE repository secret"
          }
          flutter build windows --release `
            "--build-name=$version" `
            "--dart-define=API_BASE=$apiBase" `
            "--dart-define=APP_VERSION=$version" `
            "--dart-define=APP_NAME=$appName" `
            "--dart-define=LOGO_URL=$logoUrl" `
            "--dart-define=REMOTE_CONFIG_URL=$configUrl" `
            "--dart-define=REMOTE_CONFIG_PUBLIC_KEY=$configKey" `
            "--dart-define=REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY=$prevConfigKey" `
            "--dart-define=UPDATE_PUBLIC_KEY=$updateKey" `
            "--dart-define=UPDATE_PREVIOUS_PUBLIC_KEY=$prevUpdateKey"

      - name: Bundle Windows runtime
        shell: pwsh
        run: .\tool\bundle_windows_singbox.ps1 -ReleaseDir "build\windows\x64\runner\Release"

      - name: Apply branded Windows executable name
        shell: pwsh
        env:
          WINDOWS_EXE_NAME: ${{ steps.branding.outputs.windows_exe_name }}
        run: |
          $source = "build\windows\x64\runner\Release\Client.exe"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Windows executable is missing: $source"
          }
          Rename-Item -LiteralPath $source -NewName $env:WINDOWS_EXE_NAME

      - name: Install Inno Setup
        shell: pwsh
        run: .\tool\install_inno_chinese.ps1

      - name: Build installer
        shell: pwsh
        env:
          WINDOWS_EXE_NAME: ${{ steps.branding.outputs.windows_exe_name }}
        run: |
          # 从 tag 提取版本号（v1.2.0 → 1.2.0），非 tag 构建用 0.0.0
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" }
          $appName   = if ("${{ secrets.APP_NAME }}")  { "${{ secrets.APP_NAME }}" }  else { "Litchi" }
          $publisher = $appName
          $setupName = "$appName-Setup-$version.exe"
          Write-Host "Building installer: $appName $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$version `
            "/DMyAppName=$appName" `
            "/DMyAppPublisher=$publisher" `
            "/DMyAppExeName=$env:WINDOWS_EXE_NAME" `
            litchi_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Installer ready: installer_output\$setupName"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litchi-client-windows-${{ github.sha }}
          path: installer_output\*.exe
          retention-days: 30

      # 打了 tag（v1.2.0 等）才自动创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: installer_output\*.exe
          generate_release_notes: true

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.7'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build pinned sing-box libbox AAR
        run: |
          bash tool/build_libbox_android.sh
          test -s android/app/libs/libbox.aar
          unzip -l android/app/libs/libbox.aar | grep -q "jni/arm64-v8a/libbox.so"

      - name: Compile Android Kotlin bridge
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Generate brand assets
        run: |
          app_name="${{ secrets.APP_NAME }}"
          logo_url="${{ secrets.LOGO_URL }}"
          app_name="${app_name:-Litchi}"
          logo_url="${logo_url:-}"
          LOGO_URL="$logo_url" dart run tool/prepare_brand_assets.dart
          dart run tool/apply_branding.dart "--app-name=$app_name" "--logo-url=$logo_url" --metadata-only
          dart run flutter_launcher_icons

      - name: Configure Android signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<'EOF'
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Tagged Android releases require ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets"
            exit 1
          else
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -storepass android-ci-password \
              -keypass android-ci-password \
              -alias android-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Litchi CI,O=Litchi,C=US"
            cat > android/key.properties <<'EOF'
          storeFile=upload-keystore.jks
          storePassword=android-ci-password
          keyAlias=android-ci
          keyPassword=android-ci-password
          EOF
          fi

      - name: Build release APK (universal multi-ABI)
        run: |
          api_base="${{ secrets.API_BASE }}"
          app_name="${{ secrets.APP_NAME }}"
          logo_url="${{ secrets.LOGO_URL }}"
          config_url="${{ secrets.REMOTE_CONFIG_URL }}"
          config_key="${{ secrets.REMOTE_CONFIG_PUBLIC_KEY }}"
          prev_config_key="${{ secrets.REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY }}"
          update_key="${{ secrets.UPDATE_PUBLIC_KEY }}"
          prev_update_key="${{ secrets.UPDATE_PREVIOUS_PUBLIC_KEY }}"
          api_base="${api_base:-}"
          app_name="${app_name:-Litchi}"
          logo_url="${logo_url:-}"
          config_url="${config_url:-}"
          config_key="${config_key:-}"
          prev_config_key="${prev_config_key:-}"
          update_key="${update_key:-}"
          prev_update_key="${prev_update_key:-}"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then version="0.0.0"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* && -z "$api_base" ]]; then
            echo "::error::Tagged releases require the API_BASE repository secret"
            exit 1
          fi
          IFS='.' read -r major minor patch_extra <<< "$version"
          patch="${patch_extra%%[^0-9]*}"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          version_code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          if [ "$version_code" -le 0 ]; then version_code="${{ github.run_number }}"; fi
          # Build both a universal APK and a smaller arm64 package.
          flutter build apk --release \
            "--build-name=$version" \
            "--build-number=$version_code" \
            "--dart-define=API_BASE=$api_base" \
            "--dart-define=APP_VERSION=$version" \
            "--dart-define=APP_NAME=$app_name" \
            "--dart-define=LOGO_URL=$logo_url" \
            "--dart-define=REMOTE_CONFIG_URL=$config_url" \
            "--dart-define=REMOTE_CONFIG_PUBLIC_KEY=$config_key" \
            "--dart-define=REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY=$prev_config_key" \
            "--dart-define=UPDATE_PUBLIC_KEY=$update_key" \
            "--dart-define=UPDATE_PREVIOUS_PUBLIC_KEY=$prev_update_key"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/android-universal.apk"
          flutter build apk --release --split-per-abi \
            "--build-name=$version" \
            "--build-number=$version_code" \
            "--dart-define=API_BASE=$api_base" \
            "--dart-define=APP_VERSION=$version" \
            "--dart-define=APP_NAME=$app_name" \
            "--dart-define=LOGO_URL=$logo_url" \
            "--dart-define=REMOTE_CONFIG_URL=$config_url" \
            "--dart-define=REMOTE_CONFIG_PUBLIC_KEY=$config_key" \
            "--dart-define=REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY=$prev_config_key" \
            "--dart-define=UPDATE_PUBLIC_KEY=$update_key" \
            "--dart-define=UPDATE_PREVIOUS_PUBLIC_KEY=$prev_update_key"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            flutter build appbundle --release \
              "--build-name=$version" \
              "--build-number=$version_code" \
              "--dart-define=API_BASE=$api_base" \
              "--dart-define=APP_VERSION=$version" \
              "--dart-define=APP_NAME=$app_name" \
              "--dart-define=LOGO_URL=$logo_url" \
              "--dart-define=REMOTE_CONFIG_URL=$config_url" \
              "--dart-define=REMOTE_CONFIG_PUBLIC_KEY=$config_key" \
            "--dart-define=REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY=$prev_config_key" \
            "--dart-define=UPDATE_PUBLIC_KEY=$update_key" \
            "--dart-define=UPDATE_PREVIOUS_PUBLIC_KEY=$prev_update_key"
          fi

      - name: Verify the core includes arm64
        run: |
          apk="$RUNNER_TEMP/android-universal.apk"
          if ! unzip -l "$apk" | grep -q "lib/arm64-v8a/libbox.so"; then
            echo "::error::sing-box arm64-v8a library is missing from the APK"
            unzip -l "$apk" | grep "libbox.so" || true
            exit 1
          fi
          echo "sing-box arm64-v8a library is packaged"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            aab="build/app/outputs/bundle/release/app-release.aab"
            if ! unzip -l "$aab" | grep -q "base/lib/arm64-v8a/libbox.so"; then
              echo "::error::sing-box arm64-v8a library is missing from the AAB"
              exit 1
            fi
            echo "sing-box arm64-v8a library is packaged in the AAB"
          fi

      - name: Rename APK
        run: |
          app_name="${{ secrets.APP_NAME }}"
          app_name="${app_name:-Litchi}"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then version="0.0.0"; fi
          cp "$RUNNER_TEMP/android-universal.apk" \
             "build/app/outputs/flutter-apk/$app_name $version.apk"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "build/app/outputs/flutter-apk/$app_name $version arm64.apk"
          rm -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
                build/app/outputs/flutter-apk/app-x86_64-release.apk
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp build/app/outputs/bundle/release/app-release.aab \
              "build/app/outputs/flutter-apk/$app_name $version.aab"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litchi-client-android-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.aab
          generate_release_notes: true

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.7'

      - run: flutter pub get

      - name: Generate brand assets
        run: |
          app_name="${{ secrets.APP_NAME }}"
          logo_url="${{ secrets.LOGO_URL }}"
          app_name="${app_name:-Litchi}"
          logo_url="${logo_url:-}"
          LOGO_URL="$logo_url" dart run tool/prepare_brand_assets.dart
          dart run tool/apply_branding.dart "--app-name=$app_name" "--logo-url=$logo_url" --metadata-only
          dart run flutter_launcher_icons

      - name: Build release
        run: |
          api_base="${{ secrets.API_BASE }}"
          app_name="${{ secrets.APP_NAME }}"
          logo_url="${{ secrets.LOGO_URL }}"
          config_url="${{ secrets.REMOTE_CONFIG_URL }}"
          config_key="${{ secrets.REMOTE_CONFIG_PUBLIC_KEY }}"
          prev_config_key="${{ secrets.REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY }}"
          update_key="${{ secrets.UPDATE_PUBLIC_KEY }}"
          prev_update_key="${{ secrets.UPDATE_PREVIOUS_PUBLIC_KEY }}"
          api_base="${api_base:-}"
          app_name="${app_name:-Litchi}"
          logo_url="${logo_url:-}"
          config_url="${config_url:-}"
          config_key="${config_key:-}"
          prev_config_key="${prev_config_key:-}"
          update_key="${update_key:-}"
          prev_update_key="${prev_update_key:-}"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then version="0.0.0"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* && -z "$api_base" ]]; then
            echo "::error::Tagged releases require the API_BASE repository secret"
            exit 1
          fi
          flutter build macos --release \
            "--build-name=$version" \
            "--dart-define=API_BASE=$api_base" \
            "--dart-define=APP_VERSION=$version" \
            "--dart-define=APP_NAME=$app_name" \
            "--dart-define=LOGO_URL=$logo_url" \
            "--dart-define=REMOTE_CONFIG_URL=$config_url" \
            "--dart-define=REMOTE_CONFIG_PUBLIC_KEY=$config_key" \
            "--dart-define=REMOTE_CONFIG_PREVIOUS_PUBLIC_KEY=$prev_config_key" \
            "--dart-define=UPDATE_PUBLIC_KEY=$update_key" \
            "--dart-define=UPDATE_PREVIOUS_PUBLIC_KEY=$prev_update_key"

      - name: Bundle sing-box core (universal)
        run: bash tool/bundle_macos_singbox.sh "build/macos/Build/Products/Release/Client.app"

      - name: Ad-hoc codesign
        run: |
          app="build/macos/Build/Products/Release/Client.app"
          codesign --force --options runtime --sign - "$app/Contents/Frameworks/liblitchi_singbox.dylib"
          codesign --force --deep --options runtime --sign - \
            --entitlements macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --strict "$app" && echo "codesign ok"

      - name: Build DMG
        run: |
          app="build/macos/Build/Products/Release/Client.app"
          app_name="${{ secrets.APP_NAME }}"
          app_name="${app_name:-Litchi}"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then version="0.0.0"; fi
          dmg="$app_name $version.dmg"
          rm -rf dmg-stage && mkdir -p dmg-stage
          cp -R "$app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "$app_name" -srcfolder dmg-stage \
            -ov -format UDZO "$dmg"
          ls -lh "$dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litchi-client-macos-${{ github.sha }}
          path: "*.dmg"
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: "*.dmg"
          generate_release_notes: true

  # ── Signing + R2 upload moved to .github/workflows/publish.yml ─────────────
  # The Ed25519 signing private key is only exposed to that manually-triggered,
  # environment-protected workflow (see tool/KEY_ROTATION.md). It is kept out of
  # this always-running build pipeline so a main-branch or build-workflow
  # compromise cannot reach the key that signs update.json and remote_config.
