name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

# Required so softprops/action-gh-release can create/update the GitHub Release
# on v* tags (the default workflow token is read-only otherwise → 403).
permissions:
  contents: write

env:
  MIHOMO_VERSION: v1.19.27
  MIHOMO_WINDOWS_AMD64_SHA256: "34b4c5bc0c176eebd298f6624aa23ea41985a2c54efb04eb0e9c4542e45190ee"
  MIHOMO_DARWIN_AMD64_SHA256:  "5392bea435a1c4b0a496571daafa977f744207cfafac18fb78a9b7d0747585c2"
  MIHOMO_DARWIN_ARM64_SHA256:  "3617c9d8a5a55aecfe1ebd0f55ff59f2706c8ad68fd65c6c4e5f7cf2b74263f1"
  WINTUN_VERSION: "0.14.1"
  WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build release
        shell: pwsh
        run: |
          $apiBase   = if ("${{ secrets.API_BASE }}")  { "${{ secrets.API_BASE }}" }  else { "" }
          $appName   = if ("${{ secrets.APP_NAME }}")  { "${{ secrets.APP_NAME }}" }  else { "Litchi" }
          $logoUrl   = if ("${{ secrets.LOGO_URL }}")  { "${{ secrets.LOGO_URL }}" }  else { "" }
          $version   = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" }
          flutter build windows --release `
            "--dart-define=API_BASE=$apiBase" `
            "--dart-define=APP_VERSION=$version" `
            "--dart-define=APP_NAME=$appName" `
            "--dart-define=LOGO_URL=$logoUrl"

      - name: Download mihomo
        shell: pwsh
        run: |
          $version = $env:MIHOMO_VERSION
          $name = "mihomo-windows-amd64-$version.zip"
          $url = "https://github.com/MetaCubeX/mihomo/releases/download/$version/$name"
          Write-Host "Downloading $name"
          Invoke-WebRequest -Uri $url -OutFile mihomo.zip
          $actual = (Get-FileHash mihomo.zip -Algorithm SHA256).Hash.ToLower()
          $expected = $env:MIHOMO_WINDOWS_AMD64_SHA256.ToLower()
          if ($actual -ne $expected) {
            throw "mihomo windows sha256 mismatch: actual=$actual expected=$expected"
          }
          Write-Host "mihomo windows sha256 verified"
          Expand-Archive mihomo.zip -DestinationPath mihomo-tmp
          $exe = Get-ChildItem -Recurse -Filter "mihomo*.exe" mihomo-tmp | Select-Object -First 1
          Copy-Item $exe.FullName "build\windows\x64\runner\Release\mihomo.exe"
          Write-Host "mihomo.exe ready"

      - name: Download wintun
        shell: pwsh
        run: |
          $wintunVersion = $env:WINTUN_VERSION
          $url = "https://www.wintun.net/builds/wintun-$wintunVersion.zip"
          Write-Host "Downloading wintun $wintunVersion"
          Invoke-WebRequest -Uri $url -OutFile wintun.zip
          $actual = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          $expected = $env:WINTUN_SHA256.ToLower()
          if ($actual -ne $expected) {
            throw "wintun sha256 mismatch: actual=$actual expected=$expected"
          }
          Write-Host "wintun sha256 verified"
          Expand-Archive wintun.zip -DestinationPath wintun-tmp
          Copy-Item "wintun-tmp\wintun\bin\amd64\wintun.dll" "build\windows\x64\runner\Release\wintun.dll"
          Write-Host "wintun.dll ready"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          $isl = "$langDir\ChineseSimplified.isl"
          if (-not (Test-Path $isl)) {
            Invoke-WebRequest `
              -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" `
              -OutFile $isl
            Write-Host "Downloaded ChineseSimplified.isl"
          }

      - name: Build installer
        shell: pwsh
        run: |
          # 从 tag 提取版本号（v1.2.0 → 1.2.0），非 tag 构建用 0.0.0
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" }
          $appName   = if ("${{ secrets.APP_NAME }}")  { "${{ secrets.APP_NAME }}" }  else { "Litchi" }
          $publisher = $appName
          $setupName = "$appName-Setup-$version.exe"
          Write-Host "Building installer: $appName $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$version `
            "/DMyAppName=$appName" `
            "/DMyAppPublisher=$publisher" `
            litchi_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Installer ready: installer_output\$setupName"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: litchi-client-windows-${{ github.sha }}
          path: installer_output\*.exe
          retention-days: 30

      # 打了 tag（v1.2.0 等）才自动创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output\*.exe
          generate_release_notes: true

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Configure Android signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<'EOF'
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Tagged Android releases require ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets"
            exit 1
          else
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -storepass android-ci-password \
              -keypass android-ci-password \
              -alias android-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Litchi CI,O=Litchi,C=US"
            cat > android/key.properties <<'EOF'
          storeFile=upload-keystore.jks
          storePassword=android-ci-password
          keyAlias=android-ci
          keyPassword=android-ci-password
          EOF
          fi

      - name: Build release APK (multi-ABI)
        run: |
          api_base="${{ secrets.API_BASE }}"
          app_name="${{ secrets.APP_NAME }}"
          logo_url="${{ secrets.LOGO_URL }}"
          api_base="${api_base:-}"
          app_name="${app_name:-Litchi}"
          logo_url="${logo_url:-}"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then version="0.0.0"; fi
          IFS='.' read -r major minor patch_extra <<< "$version"
          patch="${patch_extra%%[^0-9]*}"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          version_code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          if [ "$version_code" -le 0 ]; then version_code="${{ github.run_number }}"; fi
          # Gradle builds the embedded multi-ABI mihomo shared libraries.
          flutter build apk --release \
            "--build-name=$version" \
            "--build-number=$version_code" \
            "--dart-define=API_BASE=$api_base" \
            "--dart-define=APP_VERSION=$version" \
            "--dart-define=APP_NAME=$app_name" \
            "--dart-define=LOGO_URL=$logo_url"

      - name: Verify the core includes arm64
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          if ! unzip -l "$apk" | grep -q "lib/arm64-v8a/liblitchi_mihomo.so"; then
            echo "::error::mihomo arm64-v8a library is missing from the APK"
            unzip -l "$apk" | grep "liblitchi_" || true
            exit 1
          fi
          echo "mihomo arm64-v8a library is packaged"

      - name: Rename APK
        run: |
          app_name="${{ secrets.APP_NAME }}"
          app_name="${app_name:-Litchi}"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then version="0.0.0"; fi
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/$app_name $version.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: litchi-client-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build release
        run: |
          api_base="${{ secrets.API_BASE }}"
          app_name="${{ secrets.APP_NAME }}"
          logo_url="${{ secrets.LOGO_URL }}"
          api_base="${api_base:-}"
          app_name="${app_name:-Litchi}"
          logo_url="${logo_url:-}"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then version="0.0.0"; fi
          flutter build macos --release \
            "--dart-define=API_BASE=$api_base" \
            "--dart-define=APP_VERSION=$version" \
            "--dart-define=APP_NAME=$app_name" \
            "--dart-define=LOGO_URL=$logo_url"

      - name: Bundle mihomo core (universal)
        run: |
          app="build/macos/Build/Products/Release/litchi_client.app"
          if [ ! -d "$app" ]; then echo "::error::app bundle not found at $app"; ls -la build/macos/Build/Products/Release || true; exit 1; fi
          version="$MIHOMO_VERSION"
          amd_name="mihomo-darwin-amd64-$version.gz"
          arm_name="mihomo-darwin-arm64-$version.gz"
          amd_url="https://github.com/MetaCubeX/mihomo/releases/download/$version/$amd_name"
          arm_url="https://github.com/MetaCubeX/mihomo/releases/download/$version/$arm_name"
          echo "mihomo version: $version"
          echo "amd64: $amd_url"
          echo "arm64: $arm_url"
          curl -sSL "$amd_url" -o mihomo-amd64.gz
          curl -sSL "$arm_url" -o mihomo-arm64.gz
          actual_amd=$(shasum -a 256 mihomo-amd64.gz | awk '{print $1}')
          if [ "$actual_amd" != "$MIHOMO_DARWIN_AMD64_SHA256" ]; then
            echo "::error::mihomo darwin amd64 sha256 mismatch: actual=$actual_amd expected=$MIHOMO_DARWIN_AMD64_SHA256"
            exit 1
          fi
          actual_arm=$(shasum -a 256 mihomo-arm64.gz | awk '{print $1}')
          if [ "$actual_arm" != "$MIHOMO_DARWIN_ARM64_SHA256" ]; then
            echo "::error::mihomo darwin arm64 sha256 mismatch: actual=$actual_arm expected=$MIHOMO_DARWIN_ARM64_SHA256"
            exit 1
          fi
          echo "mihomo darwin sha256 verified"
          gunzip mihomo-amd64.gz
          gunzip mihomo-arm64.gz
          # Combine into a universal binary so the build runs on both Intel and Apple Silicon Macs.
          lipo -create mihomo-amd64 mihomo-arm64 -output mihomo
          chmod +x mihomo
          mkdir -p "$app/Contents/Resources"
          cp mihomo "$app/Contents/Resources/mihomo"
          lipo -info "$app/Contents/Resources/mihomo" || true

      - name: Ad-hoc codesign
        run: |
          app="build/macos/Build/Products/Release/litchi_client.app"
          # Sign the embedded core first, then deep-sign the whole bundle ad-hoc.
          # Credentials use a portable store on macOS (no Keychain), so no
          # keychain entitlement is needed — keeping the signature plain avoids
          # the Gatekeeper "cannot verify" hard block on ad-hoc builds.
          codesign --force --sign - "$app/Contents/Resources/mihomo"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app" && echo "codesign ok"

      - name: Build DMG
        run: |
          app="build/macos/Build/Products/Release/litchi_client.app"
          app_name="${{ secrets.APP_NAME }}"
          app_name="${app_name:-Litchi}"
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then version="0.0.0"; fi
          dmg="$app_name $version.dmg"
          rm -rf dmg-stage && mkdir -p dmg-stage
          cp -R "$app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "$app_name" -srcfolder dmg-stage \
            -ov -format UDZO "$dmg"
          ls -lh "$dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: litchi-client-macos-${{ github.sha }}
          path: "*.dmg"
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
          generate_release_notes: true
