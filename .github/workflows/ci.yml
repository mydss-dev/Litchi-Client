name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

# Required so softprops/action-gh-release can create/update the GitHub Release
# on v* tags (the default workflow token is read-only otherwise → 403).
permissions:
  contents: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build release
        shell: pwsh
        run: |
          $apiBase     = if ("${{ secrets.API_BASE }}")          { "${{ secrets.API_BASE }}" }          else { "https://placeholder.example.com" }
          $updateUrl   = if ("${{ secrets.UPDATE_CHECK_URL }}")  { "${{ secrets.UPDATE_CHECK_URL }}" }  else { "" }
          $appName     = if ("${{ secrets.APP_NAME }}")          { "${{ secrets.APP_NAME }}" }          else { "Litchi" }
          $appSubtitle = if ("${{ secrets.APP_SUBTITLE }}")      { "${{ secrets.APP_SUBTITLE }}" }      else { "Network Client" }
          $logoLetter  = if ("${{ secrets.LOGO_LETTER }}")       { "${{ secrets.LOGO_LETTER }}" }       else { "L" }
          $colorStart  = if ("${{ secrets.BRAND_COLOR_START }}") { "${{ secrets.BRAND_COLOR_START }}" } else { "2563EB" }
          $colorEnd    = if ("${{ secrets.BRAND_COLOR_END }}")   { "${{ secrets.BRAND_COLOR_END }}" }   else { "7C3AED" }
          flutter build windows --release `
            "--dart-define=API_BASE=$apiBase" `
            "--dart-define=APP_VERSION=1.2.0" `
            "--dart-define=UPDATE_CHECK_URL=$updateUrl" `
            "--dart-define=APP_NAME=$appName" `
            "--dart-define=APP_SUBTITLE=$appSubtitle" `
            "--dart-define=LOGO_LETTER=$logoLetter" `
            "--dart-define=BRAND_COLOR_START=$colorStart" `
            "--dart-define=BRAND_COLOR_END=$colorEnd"

      - name: Download sing-box
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/latest" `
            -Headers @{ "User-Agent" = "litchi-ci"; "Authorization" = "Bearer $env:GITHUB_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -match "windows-amd64\.zip$" } | Select-Object -First 1
          if (-not $asset) { Write-Error "sing-box Windows asset not found"; exit 1 }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile singbox.zip
          Expand-Archive singbox.zip -DestinationPath singbox-tmp
          $exe = Get-ChildItem -Recurse -Filter "sing-box.exe" singbox-tmp | Select-Object -First 1
          Copy-Item $exe.FullName "build\windows\x64\runner\Release\sing-box.exe"
          Write-Host "sing-box.exe ready"

      - name: Download wintun
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-tmp
          Copy-Item "wintun-tmp\wintun\bin\amd64\wintun.dll" "build\windows\x64\runner\Release\wintun.dll"
          Write-Host "wintun.dll ready"

      - name: Download rule sets
        shell: pwsh
        run: |
          $rulesDir = "build\windows\x64\runner\Release\rules"
          New-Item -ItemType Directory -Force -Path $rulesDir | Out-Null
          # sing-geosite and sing-geoip no longer ship .srs files in releases —
          # they switched to .db format. The pre-compiled binary rule sets (.srs)
          # live in the `sing` branch of each repo and are updated on every push.
          $files = @{
            "geosite-cn.srs"              = "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-cn.srs"
            "geosite-category-ads-all.srs"= "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-category-ads-all.srs"
            "geoip-cn.srs"                = "https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs"
          }
          foreach ($kv in $files.GetEnumerator()) {
            Write-Host "Downloading $($kv.Key) ..."
            Invoke-WebRequest -Uri $kv.Value -OutFile "$rulesDir\$($kv.Key)"
            $size = [math]::Round((Get-Item "$rulesDir\$($kv.Key)").Length / 1KB)
            Write-Host "Done: $($kv.Key) ($size KB)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          $isl = "$langDir\ChineseSimplified.isl"
          if (-not (Test-Path $isl)) {
            Invoke-WebRequest `
              -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" `
              -OutFile $isl
            Write-Host "Downloaded ChineseSimplified.isl"
          }

      - name: Build installer
        shell: pwsh
        run: |
          # 从 tag 提取版本号（v1.2.0 → 1.2.0），非 tag 构建用 0.0.0
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" }
          $appName = if ("${{ secrets.APP_NAME }}") { "${{ secrets.APP_NAME }} Client" } else { "Litchi Client" }
          $publisher = if ("${{ secrets.APP_NAME }}") { "${{ secrets.APP_NAME }}" } else { "Litchi" }
          Write-Host "Building installer: $appName $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$version `
            "/DMyAppName=$appName" `
            "/DMyAppPublisher=$publisher" `
            litchi_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Installer ready: installer_output\LitchiClient-Setup-$version.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: litchi-windows-${{ github.sha }}
          path: installer_output\*.exe
          retention-days: 30

      # 打了 tag（v1.2.0 等）才自动创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output\*.exe
          generate_release_notes: true

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: flutter pub get

      - name: Build release APK (multi-ABI)
        run: |
          api_base="${{ secrets.API_BASE }}"
          update_url="${{ secrets.UPDATE_CHECK_URL }}"
          app_name="${{ secrets.APP_NAME }}"
          app_subtitle="${{ secrets.APP_SUBTITLE }}"
          logo_letter="${{ secrets.LOGO_LETTER }}"
          color_start="${{ secrets.BRAND_COLOR_START }}"
          color_end="${{ secrets.BRAND_COLOR_END }}"
          api_base="${api_base:-https://placeholder.example.com}"
          app_name="${app_name:-Litchi}"
          app_subtitle="${app_subtitle:-Network Client}"
          logo_letter="${logo_letter:-L}"
          color_start="${color_start:-2563EB}"
          color_end="${color_end:-7C3AED}"
          # ensureOfficialLibbox builds the official multi-ABI libbox.aar here
          # (Go + NDK + gomobile are installed above), so the core works on arm64.
          flutter build apk --release \
            "--dart-define=API_BASE=$api_base" \
            "--dart-define=APP_VERSION=1.2.0" \
            "--dart-define=UPDATE_CHECK_URL=$update_url" \
            "--dart-define=APP_NAME=$app_name" \
            "--dart-define=APP_SUBTITLE=$app_subtitle" \
            "--dart-define=LOGO_LETTER=$logo_letter" \
            "--dart-define=BRAND_COLOR_START=$color_start" \
            "--dart-define=BRAND_COLOR_END=$color_end"

      - name: Verify the core includes arm64
        run: |
          aar="android/app/libs/libbox.aar"
          if ! unzip -l "$aar" | grep -q "jni/arm64-v8a/"; then
            echo "::error::libbox.aar is missing arm64-v8a — the APK would not run on real phones"
            unzip -l "$aar" | grep "jni/" || true
            exit 1
          fi
          echo "libbox.aar contains arm64-v8a ✅"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: litchi-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build release
        run: |
          api_base="${{ secrets.API_BASE }}"
          update_url="${{ secrets.UPDATE_CHECK_URL }}"
          app_name="${{ secrets.APP_NAME }}"
          app_subtitle="${{ secrets.APP_SUBTITLE }}"
          logo_letter="${{ secrets.LOGO_LETTER }}"
          color_start="${{ secrets.BRAND_COLOR_START }}"
          color_end="${{ secrets.BRAND_COLOR_END }}"
          api_base="${api_base:-https://placeholder.example.com}"
          app_name="${app_name:-Litchi}"
          app_subtitle="${app_subtitle:-Network Client}"
          logo_letter="${logo_letter:-L}"
          color_start="${color_start:-2563EB}"
          color_end="${color_end:-7C3AED}"
          flutter build macos --release \
            "--dart-define=API_BASE=$api_base" \
            "--dart-define=APP_VERSION=1.2.0" \
            "--dart-define=UPDATE_CHECK_URL=$update_url" \
            "--dart-define=APP_NAME=$app_name" \
            "--dart-define=APP_SUBTITLE=$app_subtitle" \
            "--dart-define=LOGO_LETTER=$logo_letter" \
            "--dart-define=BRAND_COLOR_START=$color_start" \
            "--dart-define=BRAND_COLOR_END=$color_end"

      - name: Bundle sing-box core (universal)
        run: |
          app="build/macos/Build/Products/Release/litchi_client.app"
          if [ ! -d "$app" ]; then echo "::error::app bundle not found at $app"; ls -la build/macos/Build/Products/Release || true; exit 1; fi
          release=$(curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "User-Agent: litchi-ci" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest)
          amd_url=$(echo "$release" | grep -o 'https://[^"]*darwin-amd64\.tar\.gz' | head -1)
          arm_url=$(echo "$release" | grep -o 'https://[^"]*darwin-arm64\.tar\.gz' | head -1)
          if [ -z "$amd_url" ] || [ -z "$arm_url" ]; then echo "::error::sing-box darwin assets not found"; exit 1; fi
          echo "amd64: $amd_url"; echo "arm64: $arm_url"
          curl -sSL "$amd_url" -o amd.tar.gz && tar -xzf amd.tar.gz
          curl -sSL "$arm_url" -o arm.tar.gz && tar -xzf arm.tar.gz
          amd_bin=$(find . -maxdepth 2 -type f -name sing-box -path '*amd64*' | head -1)
          arm_bin=$(find . -maxdepth 2 -type f -name sing-box -path '*arm64*' | head -1)
          echo "amd_bin=$amd_bin  arm_bin=$arm_bin"
          # Combine into a universal binary so the build runs on both Intel and Apple Silicon Macs.
          lipo -create "$amd_bin" "$arm_bin" -output sing-box || cp "$arm_bin" sing-box
          chmod +x sing-box
          mkdir -p "$app/Contents/Resources"
          cp sing-box "$app/Contents/Resources/sing-box"
          lipo -info "$app/Contents/Resources/sing-box" || true

      - name: Ad-hoc codesign
        run: |
          app="build/macos/Build/Products/Release/litchi_client.app"
          # Sign the embedded core first, then deep-sign the whole bundle ad-hoc.
          # Credentials use a portable store on macOS (no Keychain), so no
          # keychain entitlement is needed — keeping the signature plain avoids
          # the Gatekeeper "cannot verify" hard block on ad-hoc builds.
          codesign --force --sign - "$app/Contents/Resources/sing-box"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app" && echo "codesign ok"

      - name: Build DMG
        run: |
          app="build/macos/Build/Products/Release/litchi_client.app"
          rm -rf dmg-stage && mkdir -p dmg-stage
          cp -R "$app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Litchi Client" -srcfolder dmg-stage \
            -ov -format UDZO litchi-macos.dmg
          ls -lh litchi-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: litchi-macos-${{ github.sha }}
          path: litchi-macos.dmg
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: litchi-macos.dmg
          generate_release_notes: true
