name: Apply Fail-Closed Shutdown Hardening

on:
  push:
    branches: [fix/windows-tun-service-architecture]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[shutdown-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/windows-tun-service-architecture
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Apply shutdown hardening
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/harden_shutdown.py
          python3 /tmp/harden_shutdown.py
      - name: Format and verify
        run: |
          dart format lib/app/core_controller.dart lib/shared/services/windows_core_process_manager.dart
          git diff --check
      - name: Commit shutdown hardening
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/core_controller.dart lib/shared/services/windows_core_process_manager.dart
          git commit -m 'fix(windows): keep shutdown fail closed [shutdown-hardened]'
          git push origin HEAD:fix/windows-tun-service-architecture
