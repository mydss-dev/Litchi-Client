name: Apply Fail-Closed Shutdown Hardening

on:
  push:
    branches: [fix/windows-tun-service-architecture]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[shutdown-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/windows-tun-service-architecture
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Repair shutdown message
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/app/core_controller.dart')
          text = path.read_text(encoding='utf-8')
          old = 'Windows TUN 服务停止父倁无法确认，为避免直跞沄漏囲保持保护父态'
          new = 'Windows TUN 服务停止状态无法确认，为避免直连泄漏已保持保护状态'
          if new not in text:
              if old not in text:
                  raise SystemExit('shutdown error text not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          dart format lib/app/core_controller.dart
          git diff --check
      - name: Commit repaired text
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/core_controller.dart
          git commit -m 'fix(windows): repair shutdown error text [shutdown-hardened]'
          git push origin HEAD:fix/windows-tun-service-architecture
