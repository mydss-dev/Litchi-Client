name: Dashboard Notice Node Picker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dashboard-notice-node-picker.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Update desktop dashboard flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/features/dashboard/dashboard_page.dart')
          text = p.read_text()

          old = '''        _DesktopAlerts(
          ctrl: ctrl,
          onConnectionRetry: _toggleConnection,
          onDataRetry: _handlePullRefresh,
        ),
        if (noPlan)
'''
          new = '''        _DesktopAlerts(
          ctrl: ctrl,
          onConnectionRetry: _toggleConnection,
          onDataRetry: _handlePullRefresh,
        ),
        NoticeCarousel(notices: ctrl.notices, isLoading: ctrl.noticesLoading),
        const SizedBox(height: 16),
        if (noPlan)
'''
          if old not in text:
              raise SystemExit('desktop alert anchor not found')
          text = text.replace(old, new, 1)

          old = '''                      onTap: () => ctrl.goToPage(AppPage.nodes),
'''
          new = '''                      onTap: () => showNodePicker(context),
'''
          if old not in text:
              raise SystemExit('desktop node navigation anchor not found')
          text = text.replace(old, new, 1)

          old = '''        ],
        const SizedBox(height: 16),
        NoticeCarousel(notices: ctrl.notices, isLoading: ctrl.noticesLoading),
      ],
'''
          new = '''        ],
      ],
'''
          if old not in text:
              raise SystemExit('desktop notice footer anchor not found')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY
          dart format lib/features/dashboard/dashboard_page.dart
          flutter pub get
          flutter test
          flutter analyze
          git diff --check
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/dashboard/dashboard_page.dart
          git commit -m "refactor(desktop): surface notices and inline node selection"
          git push origin HEAD:main

  windows-verify:
    needs: refactor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Build Windows debug
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --debug
