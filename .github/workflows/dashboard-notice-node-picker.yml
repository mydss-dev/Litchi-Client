name: Dashboard Notice Node Picker

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dashboard-notice-node-picker.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Apply dashboard patch
        run: python3 tool/dashboard_notice_node_picker.py
      - name: Verify Flutter
        run: |
          dart format lib/features/dashboard/dashboard_page.dart
          flutter pub get
          flutter test
          flutter analyze
          git diff --check
      - name: Commit verified product changes
        run: |
          rm tool/dashboard_notice_node_picker.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(desktop): surface notices and inline node selection"
          git push origin HEAD:main

  windows_verify:
    needs: refactor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Build Windows debug
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --debug
