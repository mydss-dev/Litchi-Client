name: Fix Publish Dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-publish-dispatch.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Publish for v1.1.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.1.4
