name: Publish v1.1.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.1.5.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official Publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" -f tag=v1.1.5
