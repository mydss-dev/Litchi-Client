name: Reconcile PR 118 Once

on:
  push:
    branches: [fix/v3-detail-pages-20260920]
    paths:
      - '.github/workflows/v3-resolve-pr118-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Fetch and verify merge inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "ORIGINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = '2674110634b8ca2dd60a2cca45c6ce5ec23637f5'
          echo "MAIN_HEAD=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git fetch --depth=1 origin 53ae82905cedfcf2bf7dae740963947b67be223e
          git fetch --depth=1 origin e1e157af02ec42d62b1cc164e2d72b31ca56da56
          git show e1e157af02ec42d62b1cc164e2d72b31ca56da56:tool/v3_four_rounds_integration_once.py > /tmp/v3_integrate_118.py
      - name: Integrate only reviewed PR 118 delta onto merged PR 117
        shell: bash
        run: |
          git switch --detach "$MAIN_HEAD"
          python3 /tmp/v3_integrate_118.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format imported regression test only
        run: dart format test/visual/v3_detail_pages_unification_test.dart
      - name: Static analysis
        run: flutter analyze
      - name: Full test suite
        run: flutter test
      - name: Create fast-forward merge commit on PR 118 only
        shell: bash
        run: |
          set -euo pipefail
          git add lib/v3/pages/v3_account_page.dart lib/v3/pages/v3_nodes_page.dart lib/v3/pages/v3_shop_page.dart test/visual/v3_detail_pages_unification_test.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TREE=$(git write-tree)
          COMMIT=$(printf 'merge: reconcile PR 118 with V3 foundations\n' | git commit-tree "$TREE" -p "$ORIGINAL_HEAD" -p "$MAIN_HEAD")
          git push origin "$COMMIT:refs/heads/fix/v3-detail-pages-20260920"
