name: Desktop Modal IA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-modal-ia.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Apply desktop modal IA refactor
        run: |
          python3 tool/desktop_modal_ia_refactor.py
          python3 tool/desktop_modal_ia_fix.py
      - name: Format and verify Flutter
        run: |
          dart format \
            lib/app/nav_destinations.dart \
            lib/features/account/account_page.dart \
            lib/features/account/wallet_page.dart \
            lib/features/orders/orders_page.dart \
            lib/features/nodes/node_picker.dart \
            lib/shared/widgets/app_bottom_sheet.dart \
            lib/shared/widgets/app_modal.dart
          flutter pub get
          flutter test
          flutter analyze
          git diff --check
      - name: Verify desktop IA structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          nav = Path('lib/app/nav_destinations.dart').read_text()
          account = Path('lib/features/account/account_page.dart').read_text()
          wallet = Path('lib/features/account/wallet_page.dart').read_text()
          orders = Path('lib/features/orders/orders_page.dart').read_text()
          picker = Path('lib/features/nodes/node_picker.dart').read_text()
          modal = Path('lib/shared/widgets/app_bottom_sheet.dart').read_text()
          primary = nav.split('desktopPrimaryDestinations = [', 1)[1].split('];', 1)[0]
          assert primary.index('AppPage.tickets') < primary.index('AppPage.settings')
          account_destinations = nav.split('desktopAccountDestinations = [', 1)[1].split('];', 1)[0]
          assert 'AppPage.tickets' not in account_destinations
          assert 'showWalletRechargeModal(context)' in account
          assert 'showWalletWithdrawModal(context)' in account
          assert 'showOrdersModal(context)' in account
          assert 'ctrl.goToPage(items[index].page)' not in account
          assert 'Future<void> showWalletRechargeModal' in wallet
          assert 'class _RechargeModal' in wallet
          assert 'Future<void> showOrdersModal' in orders
          assert 'maxWidth: 760' in orders
          assert 'CorePlatformSupport.isDesktop' in picker
          assert 'maxWidth: 720' in picker
          assert 'DraggableScrollableSheet' in picker
          assert 'final double maxWidth;' in modal
          PY
      - name: Commit verified product changes
        run: |
          rm tool/desktop_modal_ia_refactor.py tool/desktop_modal_ia_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(desktop): unify account and node modal flows"
          git push origin HEAD:main

  windows-verify:
    needs: refactor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Build Windows debug
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --debug
