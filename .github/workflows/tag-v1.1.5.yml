name: Tag v1.1.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tag-v1.1.5.yml'

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify release tag
        run: |
          git fetch --tags --force
          TAG_SHA="$(git rev-list -n 1 v1.1.5)"
          test "$TAG_SHA" = "ba7f0cee05dcfc4b839e20cda495aa2ca92155f8"
      - name: Dispatch release CI on tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref v1.1.5
