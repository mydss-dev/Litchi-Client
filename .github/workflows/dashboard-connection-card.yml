name: Dashboard Connection Card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dashboard-connection-card.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Center desktop connection card
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/features/dashboard/dashboard_page.dart')
          text = p.read_text()

          text = text.replace(
              """                        uploadBps: ctrl.upBps,\n                        downloadBps: ctrl.downBps,\n""",
              "",
          )

          pattern = re.compile(
              r"class _DesktopConnectionCard extends StatelessWidget \{.*?\n\}\n\nclass _DesktopPowerButton",
              re.S,
          )
          replacement = r'''class _DesktopConnectionCard extends StatelessWidget {
            const _DesktopConnectionCard({
              required this.status,
              required this.proxyMode,
              required this.elapsedLabel,
              required this.supportsConnection,
              required this.onToggle,
              required this.onModeChanged,
            });

            final ConnectionStatus status;
            final ProxyMode proxyMode;
            final String elapsedLabel;
            final bool supportsConnection;
            final VoidCallback onToggle;
            final ValueChanged<ProxyMode> onModeChanged;

            @override
            Widget build(BuildContext context) {
              final c = AppColors.of(context);
              final isBusy =
                  status == ConnectionStatus.connecting ||
                  status == ConnectionStatus.disconnecting;
              final (statusText, statusColor) = !supportsConnection
                  ? (context.l10n.businessEdition, c.textMuted)
                  : switch (status) {
                      ConnectionStatus.connected => (context.l10n.protected, c.success),
                      ConnectionStatus.connecting => (context.l10n.connecting, c.primary),
                      ConnectionStatus.disconnecting => (
                        context.l10n.disconnecting,
                        c.textMuted,
                      ),
                      ConnectionStatus.error => (
                        context.l10n.connectionFailed,
                        c.danger,
                      ),
                      ConnectionStatus.disconnected => (
                        context.l10n.notConnected,
                        c.textMuted,
                      ),
                    };
              final actionText = !supportsConnection
                  ? context.l10n.unavailable
                  : switch (status) {
                      ConnectionStatus.connected => context.l10n.disconnectConnection,
                      ConnectionStatus.connecting => context.l10n.connecting,
                      ConnectionStatus.disconnecting => context.l10n.disconnecting,
                      ConnectionStatus.error => context.l10n.reconnect,
                      ConnectionStatus.disconnected => context.l10n.startConnection,
                    };
              final actionColor = !supportsConnection
                  ? c.textMuted
                  : switch (status) {
                      ConnectionStatus.connected => c.success,
                      ConnectionStatus.connecting => c.primary,
                      ConnectionStatus.disconnecting => c.textMuted,
                      ConnectionStatus.error => c.danger,
                      ConnectionStatus.disconnected => c.textPrimary,
                    };

              return AppCard(
                height: 300,
                radius: AppRadius.lg,
                padding: const EdgeInsets.all(18),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Align(
                      alignment: Alignment.center,
                      child: _StatusPill(
                        status: status,
                        label: statusText,
                        color: statusColor,
                      ),
                    ),
                    const SizedBox(height: 16),
                    Align(
                      alignment: Alignment.center,
                      child: _DesktopPowerButton(
                        status: status,
                        disabled: isBusy || !supportsConnection,
                        tooltip: actionText,
                        onTap: onToggle,
                      ),
                    ),
                    const SizedBox(height: 10),
                    Text(
                      actionText,
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      textAlign: TextAlign.center,
                      style: AppTextStyles.sectionTitle.copyWith(
                        color: actionColor,
                        fontSize: 18,
                      ),
                    ),
                    const SizedBox(height: 3),
                    Text(
                      status == ConnectionStatus.connected
                          ? elapsedLabel
                          : context.l10n.proxyMode,
                      textAlign: TextAlign.center,
                      style: AppTextStyles.caption.copyWith(color: c.textMuted),
                    ),
                    const Spacer(),
                    ModeStrip(selected: proxyMode, onChanged: onModeChanged),
                  ],
                ),
              );
            }
          }

          class _DesktopPowerButton'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'connection card replacement count={count}')

          speed_pattern = re.compile(
              r"\nclass _DesktopSpeedStat extends StatelessWidget \{.*?\n\}\n\nclass _DesktopNodeCard",
              re.S,
          )
          text, count = speed_pattern.subn('\nclass _DesktopNodeCard', text, count=1)
          if count != 1:
              raise SystemExit(f'speed stat removal count={count}')

          p.write_text(text)
          PY
          dart format lib/features/dashboard/dashboard_page.dart
          flutter pub get
          flutter test
          flutter analyze
          git diff --check
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/dashboard/dashboard_page.dart
          git commit -m "refactor(desktop): center connection controls"
          git push origin HEAD:main

  windows-verify:
    needs: refactor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Build Windows debug
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --debug
