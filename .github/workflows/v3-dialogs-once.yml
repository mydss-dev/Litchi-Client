name: V3 Dialogs One Shot

on:
  push:
    branches: [fix/v3-dialogs-20260920]
    paths:
      - '.github/workflows/v3-dialogs-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Apply guarded visual changes
        run: python3 tool/v3_dialogs_once.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format new components and regression tests
        run: dart format lib/v3/ui/v3_dialog_frame.dart test/visual/v3_dialog_unification_test.dart test/visual/v3_wallet_dialog_style_test.dart
      - name: Static analysis
        run: flutter analyze
      - name: Complete test suite
        run: flutter test
      - name: Commit only production changes and tests
        run: |
          git rm -f .github/workflows/v3-dialogs-once.yml tool/v3_dialogs_once.py
          git add lib/v3/ui/v3_dialog_frame.dart lib/v3/ui/v3_sheet.dart lib/v3/commerce/v3_payment_flow.dart lib/v3/pages/v3_wallet_actions.dart lib/v3/pages/v3_orders_page.dart lib/v3/pages/v3_gift_card_page.dart lib/v3/pages/v3_shop_page.dart test/visual/v3_dialog_unification_test.dart test/visual/v3_wallet_dialog_style_test.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(v3): unify purchase payment orders wallet and redemption dialogs'
          git push origin HEAD:fix/v3-dialogs-20260920
