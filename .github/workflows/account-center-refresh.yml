name: Account Center Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/account-center-refresh.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify
    runs-on: ubuntu-latest
    outputs:
      product_sha: ${{ steps.commit.outputs.product_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          lfs: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable

      - name: Apply account center refresh
        run: python3 tool/apply_account_center_refresh.py

      - name: Format staged Dart files
        run: dart format lib/features/account/account_page.dart lib/shared/models/api_models.dart lib/shared/services/panel_api.dart test/account_center_services_test.dart

      - name: Apply lint correction
        run: python3 tool/fix_account_center_lint.py

      - name: Format final Dart files
        run: dart format lib/features/account/account_page.dart lib/shared/models/api_models.dart lib/shared/services/panel_api.dart test/account_center_services_test.dart

      - run: flutter pub get
      - run: flutter test test/account_center_services_test.dart
      - run: flutter test
      - run: flutter analyze
      - run: git diff --check

      - name: Account center regression guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          account = Path('lib/features/account/account_page.dart').read_text()
          api = Path('lib/shared/services/panel_api.dart').read_text()
          models = Path('lib/shared/models/api_models.dart').read_text()
          assert 'class _DesktopFundsAccount' in account
          assert 'class _DesktopAccountMetrics' not in account
          assert "hans: '资金账户'" in account
          assert "hans: '账户服务'" in account
          assert "hans: '划转佣金'" in account
          assert "hans: '申请提现'" in account
          assert 'class _GiftCardRedeemModal' in account
          assert 'class _TelegramBindingModal' in account
          assert "'/user/redeemgiftcard'" in api
          assert "'/user/telegram/getBotInfo'" in api
          assert "'/user/unbindTelegram'" in api
          assert 'final String? telegramId;' in models
          PY

      - name: Commit product changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tool/apply_account_center_refresh.py tool/fix_account_center_lint.py
          git add lib/features/account/account_page.dart lib/shared/models/api_models.dart lib/shared/services/panel_api.dart test/account_center_services_test.dart
          git commit -m 'refactor(desktop): streamline account center services'
          git push origin HEAD:main
          echo "product_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-verify:
    name: Windows debug build
    needs: apply
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.apply.outputs.product_sha }}
          lfs: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build windows --debug
