name: Android APK Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/build_libbox_android.sh'
      - 'tool/core_versions.env'
      - 'tool/prepare_brand_assets.dart'
      - 'tool/apply_branding.dart'
      - '.github/workflows/android-apk-smoke.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/build_libbox_android.sh'
      - 'tool/core_versions.env'
      - 'tool/prepare_brand_assets.dart'
      - 'tool/apply_branding.dart'
      - '.github/workflows/android-apk-smoke.yml'

concurrency:
  group: android-apk-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Android Debug APK + pinned libbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.7'
          cache: true
          cache-dependency-path: core/singbox/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Install pinned Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Prepare fallback Litchi brand assets
        run: |
          dart run tool/prepare_brand_assets.dart
          dart run tool/apply_branding.dart --app-name=Litchi --metadata-only
          dart run flutter_launcher_icons
      - name: Analyze Flutter sources
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee flutter-analyze.log
      - name: Upload analyze diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-smoke-analyze-${{ github.sha }}
          path: flutter-analyze.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Build pinned sing-box libbox AAR
        run: |
          bash tool/build_libbox_android.sh
          test -s android/app/libs/libbox.aar
          unzip -l android/app/libs/libbox.aar | grep -q 'jni/arm64-v8a/libbox.so'
      - name: Compile Android Kotlin bridge
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --stacktrace
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Verify APK payload
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libbox.so'
          unzip -l "$apk" | grep -q 'assets/flutter_assets/assets/images/app_icon.png'
          ls -lh "$apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litchi-android-debug-smoke-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
