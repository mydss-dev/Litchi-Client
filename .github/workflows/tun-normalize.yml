name: Normalize Windows TUN Refactor

on:
  push:
    branches: [fix/windows-tun-service-architecture]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[tun-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/windows-tun-service-architecture
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Harden Windows TUN fail-closed invariants
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/harden_tun.py
          python3 /tmp/harden_tun.py
      - name: Format hardened files
        run: |
          dart format lib/app/core_controller.dart lib/shared/services/windows_tun_service_manager.dart
          git diff --check
      - name: Commit hardened files
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/core_controller.dart lib/shared/services/windows_tun_service_manager.dart
          git commit -m 'fix(windows): fail closed on unconfirmed TUN stop [tun-normalized]'
          git push origin HEAD:fix/windows-tun-service-architecture
