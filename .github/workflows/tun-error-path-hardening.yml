name: Apply TUN Error Path Hardening

on:
  push:
    branches: [fix/windows-tun-service-architecture]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[tun-error-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/windows-tun-service-architecture
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Harden TUN error paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/app/core_controller.dart')
          text = path.read_text(encoding='utf-8')
          old = "      if (_killSwitchEnabled && wasConnected) {\n        if (_activeNetworkMode == NetworkMode.tun) {\n          // Keep the Windows WFP or macOS PF session alive. Once the tunnel\n          // disappears, direct traffic remains blocked until explicit cleanup.\n        } else {\n          unawaited(ProxySetter.engageKillSwitch());\n        }\n      } else {\n        unawaited(_releaseTunKillSwitch());\n        unawaited(ProxySetter.disable());\n      }\n"
          new = "      if (_killSwitchEnabled && _activeNetworkMode == NetworkMode.tun) {\n        // Core death can race with the final connecting -> connected UI state.\n        // Once TUN protection may be active, keep WFP/PF regardless of that UI\n        // transition until an explicit teardown confirms the tunnel is gone.\n      } else if (_killSwitchEnabled && wasConnected) {\n        unawaited(ProxySetter.engageKillSwitch());\n      } else {\n        unawaited(_releaseTunKillSwitch());\n        unawaited(ProxySetter.disable());\n      }\n"
          if new not in text:
              if old not in text:
                  raise SystemExit('core error kill-switch block not found')
              text = text.replace(old, new, 1)
          text = text.replace("    final wasConnected = _status == ConnectionStatus.connected;\n    _stopTrafficMonitor();\n    _connectedAt = null;\n    _coreError = error.isEmpty ? 'Windows TUN 服务意外停止' : error;\n", "    _stopTrafficMonitor();\n    _connectedAt = null;\n    _coreError = error.isEmpty ? 'Windows TUN 服务意外停止' : error;\n", 1)
          text = text.replace("    if (!_killSwitchEnabled || !wasConnected) {\n      unawaited(_releaseTunKillSwitch());\n    }\n", "    if (!_killSwitchEnabled) {\n      unawaited(_releaseTunKillSwitch());\n    }\n", 1)
          path.write_text(text, encoding='utf-8')
          PY
          dart format lib/app/core_controller.dart
          git diff --check
      - name: Commit error-path hardening
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/core_controller.dart
          git commit -m 'fix(windows): keep TUN protection during connection errors [tun-error-hardened]'
          git push origin HEAD:fix/windows-tun-service-architecture
