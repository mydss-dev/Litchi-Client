name: Apply Missing TUN Credential Hardening

on:
  push:
    branches: [fix/windows-tun-service-architecture]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[tun-cred-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/windows-tun-service-architecture
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Apply fail-closed credential recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/shared/services/windows_tun_service_manager.dart')
          text = path.read_text(encoding='utf-8')
          old = """    final credentials = await _loadCredentials();
    if (credentials == null) {
      _running = false;
      _stopping = false;
      return true;
    }
"""
          new = """    final credentials = await _loadCredentials();
    if (credentials == null) {
      // Missing or unreadable credentials are not proof that a privileged TUN
      // disappeared. If the adapter still exists (or inspection itself fails),
      // fail closed so callers keep WFP protection instead of releasing it.
      final tunPresent = await _tunInterfacePresent();
      _running = tunPresent;
      _stopping = false;
      if (tunPresent) {
        _lastError =
            'Windows TUN 服务凭据不可用，无法确认 TUN 已停止；已保持保护状态';
        return false;
      }
      return true;
    }
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('credential-null stop block not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          dart format lib/shared/services/windows_tun_service_manager.dart
          git diff --check
      - name: Commit credential hardening
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/shared/services/windows_tun_service_manager.dart
          git commit -m 'fix(windows): fail closed when TUN credentials are missing [tun-cred-hardened]'
          git push origin HEAD:fix/windows-tun-service-architecture
