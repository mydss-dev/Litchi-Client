name: Cupertino Full Suite Preview Images

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/preview/**'
      - 'test/preview/**'
      - '.github/workflows/cupertino-preview-images.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Render real Flutter screens
        run: flutter test --update-goldens test/preview/cupertino_preview_goldens_test.dart
      - name: Upload eleven preview PNGs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: litchi-cupertino-full-preview
          path: test/preview/goldens/*.png
          if-no-files-found: error
