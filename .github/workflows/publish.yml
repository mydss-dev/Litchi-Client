name: Publish

# Generates, signs, and uploads update.json plus release packages to Cloudflare R2.
#
# Runs automatically after the CI workflow completes on a `v*` tag (workflow_run),
# or manually via workflow_dispatch as a fallback / retry.
#
# Public values are stored as Repository Variables:
#   CDN_BASE_URL
#   UPDATE_PUBLIC_KEY
#
# Private values used by this workflow are stored as Repository Secrets:
#   UPDATE_PRIVATE_KEY
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET
#
# Remote Config uses a separate Ed25519 keypair. Its private key stays local and
# is never used by this workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag whose GitHub Release holds the installers (e.g. v1.2.3)'
        required: true
        type: string
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Publish update
    runs-on: ubuntu-latest
    # Manual dispatch always runs. The auto path only runs for `v*` tag pushes.
    # CI now only runs on `v*` tags and pull requests (plain branch pushes no
    # longer trigger it), so the only non-tag CI completion is a PR run —
    # excluded by the `event == 'push'` check below. `workflow_run.head_branch`
    # is `main` for a branch push and the tag name (`v1.0.3`) for a tag push.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Manual: checkout the chosen tag. Auto: checkout the exact commit CI
          # built (head_sha) with full history so the next step can find the tag
          # that points at it.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          lfs: true

      - name: Resolve release tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            SKIP=0
          else
            git fetch --force --tags origin
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            # `--points-at` peels annotated tags to their commit, so this finds
            # both lightweight and annotated `v*` tags for the commit CI built.
            TAG="$(git tag --points-at "$HEAD_SHA" --sort=-version:refname | grep -E '^v' | head -n 1)"
            if [ -z "$TAG" ]; then
              echo "::warning::No v* tag points at $HEAD_SHA — not a tagged release build; skipping upload."
              SKIP=1
            else
              SKIP=0
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG:-<none>}"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.resolve.outputs.skip == '0'
        with:
          channel: stable

      - name: Install Dart dependencies
        if: steps.resolve.outputs.skip == '0'
        run: flutter pub get

      - name: Download installers from GitHub Release
        if: steps.resolve.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir release-artifacts \
            --pattern '*.exe' \
            --pattern '*.apk' \
            --pattern '*.dmg'

      - name: Generate and sign update.json
        if: steps.resolve.outputs.skip == '0'
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          $privKey = [Environment]::GetEnvironmentVariable('UPDATE_PRIVATE_KEY')
          $pubKey = [Environment]::GetEnvironmentVariable('UPDATE_PUBLIC_KEY')
          if ([string]::IsNullOrWhiteSpace($privKey)) {
            Write-Output '::error::UPDATE_PRIVATE_KEY (Repository Secret) is missing or empty'
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($pubKey)) {
            Write-Output '::error::UPDATE_PUBLIC_KEY (Repository Variable) is missing or empty'
            exit 1
          }
          if ($privKey.Length -ne 43) {
            Write-Output "::error::UPDATE_PRIVATE_KEY must be 43 base64url chars (32-byte Ed25519 key); got $($privKey.Length)"
            exit 1
          }
          if ($pubKey.Length -ne 43) {
            Write-Output "::error::UPDATE_PUBLIC_KEY must be 43 base64url chars (32-byte Ed25519 key); got $($pubKey.Length)"
            exit 1
          }
          if ($privKey -notmatch '^[A-Za-z0-9_-]+$') {
            Write-Output '::error::UPDATE_PRIVATE_KEY must be base64url without padding (invalid character present)'
            exit 1
          }
          if ($pubKey -notmatch '^[A-Za-z0-9_-]+$') {
            Write-Output '::error::UPDATE_PUBLIC_KEY must be base64url without padding (invalid character present)'
            exit 1
          }

          $cdnBase = "${{ vars.CDN_BASE_URL }}".Trim()
          if ([string]::IsNullOrWhiteSpace($cdnBase)) {
            throw 'Missing Repository Variable: CDN_BASE_URL'
          }
          if ($cdnBase -notmatch '^https://') {
            throw 'CDN_BASE_URL must be an absolute HTTPS URL'
          }
          $downloadBaseUrl = $cdnBase.TrimEnd('/') + '/download'

          $windows = Get-ChildItem release-artifacts -Recurse -File -Filter *.exe |
            Select-Object -First 1
          $android = Get-ChildItem release-artifacts -Recurse -File -Filter *.apk |
            Sort-Object Length -Descending |
            Select-Object -First 1
          $macos = Get-ChildItem release-artifacts -Recurse -File -Filter *.dmg |
            Select-Object -First 1
          if (-not $windows -or -not $android -or -not $macos) {
            throw 'One or more release packages are missing from the GitHub Release.'
          }

          $version = "${{ steps.resolve.outputs.tag }}" -replace '^v', ''
          $changelog = (git log -1 --pretty=%s).Trim()
          .\tool\publish_release.ps1 `
            -Version $version `
            -DownloadBaseUrl $downloadBaseUrl `
            -Changelog $changelog `
            -WindowsPackage $windows.FullName `
            -AndroidPackage $android.FullName `
            -MacosPackage $macos.FullName

      - name: Install pinned upload dependencies
        if: steps.resolve.outputs.skip == '0'
        run: |
          python -m pip install --disable-pip-version-check \
            -r tool/requirements-release.txt

      - name: Upload release to Cloudflare R2
        if: steps.resolve.outputs.skip == '0'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DOWNLOAD_BASE_URL: ${{ format('{0}/download', vars.CDN_BASE_URL) }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "::error::Missing one or more R2 Repository Secrets"
            exit 1
          fi
          case "$DOWNLOAD_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::CDN_BASE_URL must be an absolute HTTPS URL"
              exit 1
              ;;
          esac

          # Upload packages first and update.json last so clients never see a
          # version before its download files are reachable.
          set -- release_output/*.exe release_output/*.apk release_output/*.dmg
          python tool/upload_r2.py \
            "$@" \
            release_output/update.json
