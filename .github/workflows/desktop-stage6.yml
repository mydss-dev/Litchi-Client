name: Desktop Stage 6 Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-stage6.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply desktop stage 6
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent, indent

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Anchor not found: {label}')
              return text.replace(old, new, 1)

          # ── Account ──────────────────────────────────────────────────────────
          account = 'lib/features/account/account_page.dart'
          text = read(account)
          build_anchor = (
              "  @override\n"
              "  Widget build(BuildContext context) {\n"
              "    return _buildCompact(context);\n"
              "  }\n"
          )
          desktop_method = indent(dedent(r'''
          Widget _buildDesktop(BuildContext context) {
            final c = AppColors.of(context);
            final ctrl = AppScope.of(context);
            final user = ctrl.user;
            final canRenew = isPageEnabled(AppPage.shop) && ctrl.hasPlan;

            return Column(
              crossAxisAlignment: CrossAxisAlignment.stretch,
              children: [
                Row(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            context.l10n.myAccount,
                            style: AppTextStyles.pageTitle.copyWith(
                              color: c.textPrimary,
                              fontSize: 26,
                            ),
                          ),
                          const SizedBox(height: 5),
                          Text(
                            context.l10n.myAccountSubtitle,
                            style: AppTextStyles.body.copyWith(color: c.textMuted),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(width: 16),
                    Tooltip(
                      message: context.l10n.refresh,
                      child: Material(
                        color: Colors.transparent,
                        child: InkWell(
                          onTap: _handlePullRefresh,
                          mouseCursor: SystemMouseCursors.click,
                          borderRadius: BorderRadius.circular(AppRadius.md),
                          child: Ink(
                            width: 38,
                            height: 38,
                            decoration: BoxDecoration(
                              color: c.surfaceMuted,
                              borderRadius: BorderRadius.circular(AppRadius.md),
                              border: Border.all(color: c.softBorder),
                            ),
                            child: Icon(
                              LucideIcons.refreshCw,
                              size: 17,
                              color: c.iconDefault,
                            ),
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
                const SizedBox(height: 18),
                _ProfileHeader(
                  userName: user.name,
                  plan: user.plan,
                  expiry: user.expiry,
                  avatar: user.avatarLetter,
                  hidePlan: false,
                  hideExpiry: false,
                  onRenew: canRenew ? _renewCurrentPlan : null,
                  onManage: _showAccountSheet,
                ),
                const SizedBox(height: 14),
                if (!ctrl.hasPlan)
                  NoPlanCard(
                    onPurchase: isPageEnabled(AppPage.shop)
                        ? () => ctrl.goToPage(AppPage.shop)
                        : null,
                  )
                else ...[
                  _DesktopAccountMetrics(ctrl: ctrl),
                  const SizedBox(height: 14),
                  _TrafficOverviewCard(
                    usedGb: ctrl.traffic.usedGb,
                    totalGb: ctrl.traffic.totalGb,
                    remainGb: ctrl.traffic.remainGb,
                    resetDay: ctrl.resetDay,
                  ),
                ],
                const SizedBox(height: 16),
                _DesktopProfileMenuSection(ctrl: ctrl),
              ],
            );
          }
          ''').strip() + '\n', '  ')
          new_build = (
              "  @override\n"
              "  Widget build(BuildContext context) {\n"
              "    if (CorePlatformSupport.isDesktop) return _buildDesktop(context);\n"
              "    return _buildCompact(context);\n"
              "  }\n\n"
              + desktop_method
          )
          text = replace_once(text, build_anchor, new_build, 'account build')
          old_list = (
              "      child: ListView(\n"
              "        shrinkWrap: CorePlatformSupport.isDesktop,\n"
              "        physics: CorePlatformSupport.isDesktop\n"
              "            ? const NeverScrollableScrollPhysics()\n"
              "            : const AlwaysScrollableScrollPhysics(),\n"
              "        padding: EdgeInsets.zero,\n"
          )
          new_list = (
              "      child: ListView(\n"
              "        physics: const AlwaysScrollableScrollPhysics(),\n"
              "        padding: EdgeInsets.zero,\n"
          )
          text = replace_once(text, old_list, new_list, 'account compact list')
          marker = '// ── Compact-layout widgets + helpers (original MobileProfilePage, verbatim)\n'
          desktop_widgets = dedent(r'''
          // ── Desktop account widgets ──────────────────────────────────────────────

          class _DesktopAccountMetrics extends StatelessWidget {
            const _DesktopAccountMetrics({required this.ctrl});

            final AppController ctrl;

            @override
            Widget build(BuildContext context) {
              return LayoutBuilder(
                builder: (context, constraints) {
                  const gap = 12.0;
                  final width = (constraints.maxWidth - gap * 2) / 3;
                  final balance = ctrl.user.balance / 100;
                  return Wrap(
                    spacing: gap,
                    runSpacing: gap,
                    children: [
                      SizedBox(
                        width: width,
                        child: _DesktopAccountMetric(
                          icon: LucideIcons.package,
                          label: context.l10n.currentPlan,
                          value: ctrl.user.plan.isEmpty
                              ? context.l10n.noCurrentPlan
                              : ctrl.user.plan,
                        ),
                      ),
                      SizedBox(
                        width: width,
                        child: _DesktopAccountMetric(
                          icon: LucideIcons.wallet,
                          label: context.l10n.accountBalance,
                          value:
                              '${ctrl.currencySymbol}${balance.toStringAsFixed(2)}',
                        ),
                      ),
                      SizedBox(
                        width: width,
                        child: _DesktopAccountMetric(
                          icon: LucideIcons.calendarClock,
                          label: context.l10n.expiryTime,
                          value: ctrl.user.expiry.isEmpty ? '--' : ctrl.user.expiry,
                        ),
                      ),
                    ],
                  );
                },
              );
            }
          }

          class _DesktopAccountMetric extends StatelessWidget {
            const _DesktopAccountMetric({
              required this.icon,
              required this.label,
              required this.value,
            });

            final IconData icon;
            final String label;
            final String value;

            @override
            Widget build(BuildContext context) {
              final c = AppColors.of(context);
              return AppCard(
                height: 96,
                padding: const EdgeInsets.all(14),
                shadow: AppCardShadow.soft,
                child: Row(
                  children: [
                    _SmallIcon(icon: icon, color: c.primary),
                    const SizedBox(width: 10),
                    Expanded(
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            label,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: AppTextStyles.caption.copyWith(color: c.textMuted),
                          ),
                          const SizedBox(height: 5),
                          Text(
                            value,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: AppTextStyles.bodyStrong.copyWith(
                              color: c.textPrimary,
                              fontSize: 16,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class _DesktopProfileMenuSection extends StatelessWidget {
            const _DesktopProfileMenuSection({required this.ctrl});

            final AppController ctrl;

            @override
            Widget build(BuildContext context) {
              return LayoutBuilder(
                builder: (context, constraints) {
                  const gap = 10.0;
                  final columns = constraints.maxWidth >= 820 ? 4 : 3;
                  final width =
                      (constraints.maxWidth - gap * (columns - 1)) / columns;
                  return Wrap(
                    spacing: gap,
                    runSpacing: gap,
                    children: [
                      for (final item in hubDestinations)
                        SizedBox(
                          width: width,
                          child: _DesktopQuickTile(
                            icon: item.icon,
                            title: item.labelFor(context),
                            subtitle: item.subtitleFor(context),
                            onTap: () => ctrl.goToPage(item.page),
                          ),
                        ),
                    ],
                  );
                },
              );
            }
          }

          class _DesktopQuickTile extends StatelessWidget {
            const _DesktopQuickTile({
              required this.icon,
              required this.title,
              required this.subtitle,
              required this.onTap,
            });

            final IconData icon;
            final String title;
            final String subtitle;
            final VoidCallback onTap;

            @override
            Widget build(BuildContext context) {
              final c = AppColors.of(context);
              return MouseRegion(
                cursor: SystemMouseCursors.click,
                child: AppCard(
                  onTap: onTap,
                  height: 82,
                  padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                  shadow: AppCardShadow.soft,
                  child: Row(
                    children: [
                      _SmallIcon(icon: icon, color: c.primary),
                      const SizedBox(width: 10),
                      Expanded(
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              title,
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: AppTextStyles.bodyStrong.copyWith(
                                color: c.textPrimary,
                                fontSize: 13,
                              ),
                            ),
                            const SizedBox(height: 3),
                            Text(
                              subtitle,
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: AppTextStyles.caption.copyWith(
                                color: c.textMuted,
                                fontSize: 10.5,
                              ),
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(width: 6),
                      Icon(LucideIcons.chevronRight, size: 16, color: c.iconMuted),
                    ],
                  ),
                ),
              );
            }
          }

          ''')
          text = replace_once(text, marker, desktop_widgets + marker, 'account widget marker')
          write(account, text)

          # ── Traffic ──────────────────────────────────────────────────────────
          traffic = 'lib/features/traffic/traffic_page.dart'
          text = read(traffic)
          text = replace_once(
              text,
              "import '../../app/app_controller.dart';\n",
              "import '../../app/app_controller.dart';\nimport '../../app/core_platform_support.dart';\n",
              'traffic import',
          )
          build_start = (
              "  @override\n"
              "  Widget build(BuildContext context) {\n"
              "    return ResponsivePageScaffold(\n"
          )
          build_new = (
              "  @override\n"
              "  Widget build(BuildContext context) {\n"
              "    if (CorePlatformSupport.isDesktop) return _buildDesktop(context);\n"
              "    return ResponsivePageScaffold(\n"
          )
          text = replace_once(text, build_start, build_new, 'traffic build')
          shared_marker = '  // ── Shared body ────────────────────────────────────────────────────────────\n'
          traffic_method = indent(dedent(r'''
          Widget _buildDesktop(BuildContext context) {
            final c = AppColors.of(context);
            final ctrl = AppScope.of(context);
            final noPlan =
                ctrl.hasAccountSummary && !ctrl.isInitialLoading && !ctrl.hasPlan;

            return Column(
              crossAxisAlignment: CrossAxisAlignment.stretch,
              children: [
                Row(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            context.l10n.trafficStatistics,
                            style: AppTextStyles.pageTitle.copyWith(
                              color: c.textPrimary,
                              fontSize: 26,
                            ),
                          ),
                          const SizedBox(height: 5),
                          Text(
                            context.l10n.trafficStatisticsSubtitle,
                            style: AppTextStyles.body.copyWith(color: c.textMuted),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(width: 16),
                    Tooltip(
                      message: context.l10n.refresh,
                      child: Material(
                        color: Colors.transparent,
                        child: InkWell(
                          onTap: _handleRefresh,
                          mouseCursor: SystemMouseCursors.click,
                          borderRadius: BorderRadius.circular(AppRadius.md),
                          child: Ink(
                            width: 38,
                            height: 38,
                            decoration: BoxDecoration(
                              color: c.surfaceMuted,
                              borderRadius: BorderRadius.circular(AppRadius.md),
                              border: Border.all(color: c.softBorder),
                            ),
                            child: Icon(
                              LucideIcons.refreshCw,
                              size: 17,
                              color: c.iconDefault,
                            ),
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
                const SizedBox(height: 18),
                if (noPlan)
                  NoPlanCard(
                    onPurchase: isPageEnabled(AppPage.shop)
                        ? () => ctrl.goToPage(AppPage.shop)
                        : null,
                  )
                else ...[
                  _DesktopTrafficSummary(ctrl: ctrl),
                  const SizedBox(height: 16),
                  _UsageTrendCard(
                    periodDays: _periodDays,
                    onPeriodChanged: (v) => setState(() => _periodDays = v),
                  ),
                ],
              ],
            );
          }
          ''').strip() + '\n\n', '  ')
          text = replace_once(text, shared_marker, traffic_method + shared_marker, 'traffic shared marker')
          stats_marker = 'class _StatsGrid extends StatelessWidget {\n'
          traffic_widgets = dedent(r'''
          class _DesktopTrafficSummary extends StatelessWidget {
            const _DesktopTrafficSummary({required this.ctrl});

            final AppController ctrl;

            @override
            Widget build(BuildContext context) {
              final traffic = ctrl.traffic;
              final ratio = traffic.totalGb > 0
                  ? (traffic.usedGb / traffic.totalGb).clamp(0.0, 1.0)
                  : 0.0;
              final percent = (ratio * 100).toStringAsFixed(0);
              final resetDay = ctrl.resetDay;

              return LayoutBuilder(
                builder: (context, constraints) {
                  const gap = 12.0;
                  final width = (constraints.maxWidth - gap * 2) / 3;
                  return Wrap(
                    spacing: gap,
                    runSpacing: gap,
                    children: [
                      SizedBox(
                        width: width,
                        child: _DesktopTrafficMetric(
                          icon: LucideIcons.database,
                          title: context.l10n.trafficOverview,
                          value: formatGb(traffic.totalGb),
                          footer: context.l10n.usedTraffic(
                            traffic.usedGb.toStringAsFixed(1),
                            traffic.totalGb.toStringAsFixed(1),
                          ),
                        ),
                      ),
                      SizedBox(
                        width: width,
                        child: _DesktopTrafficMetric(
                          icon: LucideIcons.chartColumn,
                          title: context.l10n.usage,
                          value: formatGb(traffic.usedGb),
                          footer: context.l10n.usedPercent(percent),
                          progress: ratio,
                        ),
                      ),
                      SizedBox(
                        width: width,
                        child: _DesktopTrafficMetric(
                          icon: LucideIcons.gauge,
                          title: context.l10n.remaining,
                          value: formatGb(traffic.remainGb),
                          footer: resetDay != null && resetDay > 0
                              ? context.l10n.monthlyResetDay(resetDay)
                              : context.l10n.resetDayUnavailable,
                        ),
                      ),
                    ],
                  );
                },
              );
            }
          }

          class _DesktopTrafficMetric extends StatelessWidget {
            const _DesktopTrafficMetric({
              required this.icon,
              required this.title,
              required this.value,
              required this.footer,
              this.progress,
            });

            final IconData icon;
            final String title;
            final String value;
            final String footer;
            final double? progress;

            @override
            Widget build(BuildContext context) {
              final c = AppColors.of(context);
              return AppCard(
                height: 116,
                radius: AppRadius.lg,
                padding: const EdgeInsets.all(14),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      children: [
                        Container(
                          width: 28,
                          height: 28,
                          alignment: Alignment.center,
                          decoration: BoxDecoration(
                            color: c.primarySoft,
                            borderRadius: BorderRadius.circular(AppRadius.md),
                          ),
                          child: Icon(icon, size: 14, color: c.primary),
                        ),
                        const SizedBox(width: 8),
                        Expanded(
                          child: Text(
                            title,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                            style: AppTextStyles.caption.copyWith(
                              color: c.textMuted,
                              fontWeight: FontWeight.w700,
                            ),
                          ),
                        ),
                      ],
                    ),
                    const Spacer(),
                    Text(
                      value,
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      style: AppTextStyles.sectionTitle.copyWith(
                        color: c.textPrimary,
                        fontSize: 20,
                      ),
                    ),
                    if (progress != null) ...[
                      const SizedBox(height: 5),
                      ClipRRect(
                        borderRadius: BorderRadius.circular(AppRadius.pill),
                        child: LinearProgressIndicator(
                          value: progress,
                          minHeight: 4,
                          backgroundColor: c.surfaceMuted,
                          valueColor: AlwaysStoppedAnimation<Color>(
                            progress! > 0.85 ? c.warning : c.primary,
                          ),
                        ),
                      ),
                    ],
                    const SizedBox(height: 3),
                    Text(
                      footer,
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      style: AppTextStyles.caption.copyWith(
                        color: c.textMuted,
                        fontSize: 10.5,
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          ''')
          text = replace_once(text, stats_marker, traffic_widgets + stats_marker, 'traffic stats marker')
          write(traffic, text)

          # ── Settings ─────────────────────────────────────────────────────────
          settings = 'lib/features/settings/settings_page.dart'
          text = read(settings)
          settings_start = (
              "  @override\n"
              "  Widget build(BuildContext context) {\n"
              "    final l10n = context.l10n;\n"
              "    return ResponsivePageScaffold(\n"
          )
          settings_new = (
              "  @override\n"
              "  Widget build(BuildContext context) {\n"
              "    final l10n = context.l10n;\n"
              "    if (CorePlatformSupport.isDesktop) return _buildDesktop(context);\n"
              "    return ResponsivePageScaffold(\n"
          )
          text = replace_once(text, settings_start, settings_new, 'settings build')
          settings_marker = '  // ── Shared body (all settings sections) ────────────────────────────────────\n'
          settings_method = indent(dedent(r'''
          Widget _buildDesktop(BuildContext context) {
            final c = AppColors.of(context);
            final l10n = context.l10n;
            return Align(
              alignment: Alignment.topLeft,
              child: ConstrainedBox(
                constraints: const BoxConstraints(maxWidth: 760),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Text(
                      l10n.settings,
                      style: AppTextStyles.pageTitle.copyWith(
                        color: c.textPrimary,
                        fontSize: 26,
                      ),
                    ),
                    const SizedBox(height: 5),
                    Text(
                      l10n.settingsSubtitle,
                      style: AppTextStyles.body.copyWith(color: c.textMuted),
                    ),
                    const SizedBox(height: 18),
                    ..._bodyChildren(context),
                  ],
                ),
              ),
            );
          }
          ''').strip() + '\n\n', '  ')
          text = replace_once(text, settings_marker, settings_method + settings_marker, 'settings marker')
          write(settings, text)

      - name: Commit stage 6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/account/account_page.dart lib/features/traffic/traffic_page.dart lib/features/settings/settings_page.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat(desktop): refine account traffic and settings layouts"
          git push
