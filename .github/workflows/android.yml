name: Android Project Scaffold

on:
  push:
    branches: [feature/android-mvp]
  pull_request:
    branches: [main]

jobs:
  scaffold:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android project structure
        shell: bash
        run: |
          test -d android
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/gradle.properties
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/litchi/client/MainActivity.kt
          test -f lib/app/mobile_app_shell.dart
          test -f lib/features/mobile/mobile_home_page.dart
          test -f lib/features/mobile/mobile_nodes_page.dart
          test -f lib/features/mobile/mobile_shop_page.dart
          test -f lib/features/mobile/mobile_profile_page.dart
          test -f lib/features/mobile/mobile_settings_page.dart
          test -f lib/features/mobile/mobile_orders_page.dart

      - name: Print scaffold status
        run: echo "Android scaffold and mobile UI pages exist. APK build is intentionally paused until testing starts."
