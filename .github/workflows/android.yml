name: Android MVP Build

on:
  push:
    branches: [feature/android-mvp]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Ensure Android platform files
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Format sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --debug
