name: V3 Detail Pages One Shot

on:
  push:
    branches: [fix/v3-detail-pages-20260920]
    paths:
      - '.github/workflows/v3-detail-pages-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Apply exact-match UI changes
        run: python3 tool/v3_detail_pages_migration.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: All Flutter tests
        run: flutter test
      - name: Commit verified production and tests only
        run: |
          git rm -f .github/workflows/v3-detail-pages-once.yml tool/v3_detail_pages_migration.py
          git add lib/v3/pages/v3_nodes_page.dart lib/v3/pages/v3_shop_page.dart lib/v3/pages/v3_account_page.dart test/visual/v3_detail_pages_unification_test.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(v3): harmonize node list, plan filters and account density'
          git push origin HEAD:fix/v3-detail-pages-20260920
