name: Desktop Polish Round 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-polish-round2.yml'

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify
    runs-on: ubuntu-latest
    outputs:
      product_sha: ${{ steps.commit.outputs.product_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Apply desktop polish
        run: python3 tool/desktop_polish_round2.py

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/account/account_page.dart \
            lib/features/dashboard/dashboard_page.dart \
            lib/shared/services/plan_data_service.dart \
            lib/shared/services/data_loader.dart \
            test/data_services_test.dart

      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze
      - run: git diff --check

      - name: Structural guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          account = Path('lib/features/account/account_page.dart').read_text()
          dash = Path('lib/features/dashboard/dashboard_page.dart').read_text()
          plan = Path('lib/shared/services/plan_data_service.dart').read_text()
          data = Path('lib/shared/services/data_loader.dart').read_text()
          assert 'class _DesktopMoneyActions extends StatelessWidget' in account
          a = account.index('class _DesktopBalanceMetric')
          b = account.index('class _DesktopMoneyActions', a)
          assert 'onRecharge' not in account[a:b]
          a = dash.index('class _DesktopNodeCard extends StatelessWidget')
          b = dash.index('\nclass ', a + 10)
          assert 'onTap: onTap,' not in dash[a:b]
          assert 'syncCurrentPlanTitle' in plan
          assert 'user.plan.trim().isEmpty && currentPlan != null' not in plan
          assert 'user.plan.trim().isEmpty && currentPlan != null' not in data
          PY

      - name: Commit product changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tool/desktop_polish_round2.py
          git add \
            lib/features/account/account_page.dart \
            lib/features/dashboard/dashboard_page.dart \
            lib/shared/services/plan_data_service.dart \
            lib/shared/services/data_loader.dart \
            test/data_services_test.dart
          git commit -m 'refactor(desktop): rebalance account and home cards'
          git push origin HEAD:main
          echo "product_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows-verify:
    name: Windows debug build
    needs: apply
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.apply.outputs.product_sha }}
          lfs: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build windows --debug
