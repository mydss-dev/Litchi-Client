name: Bootstrap V3 node labels and latency PR

on:
  push:
    branches: [fix/v3-node-tags-live-speed-20260919]
    paths:
      - '.github/workflows/v3-node-tags-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Apply expected-source-checked patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma
          encoded = Path('tool/node_fix_payload.lzma.b64').read_text().strip()
          payload = lzma.decompress(base64.b64decode(encoded), format=lzma.FORMAT_ALONE)
          Path('/tmp/litchi_node_fix.py').write_bytes(payload)
          PY
          python3 /tmp/litchi_node_fix.py
          python3 - <<'PY'
          from pathlib import Path
          def fix(path, before, after):
              p = Path(path)
              text = p.read_text()
              if text.count(before) != 1:
                  raise SystemExit(f'expected exactly one analyzer fix anchor in {path}: {before!r}')
              p.write_text(text.replace(before, after, 1))
          fix('lib/app/app_controller.dart',
              'if (supportsCoreConnection) unawaited(_preloadCoreAndTestLatencies());',
              'if (supportsCoreConnection) unawaited(_preloadCoreOnly());')
          fix('test/visual/v3_node_labels_live_speed_test.dart',
              '_TaggedFixture(AppPage page) : super(page);',
              '_TaggedFixture(super.visualPage);')
          fix('lib/v3/ui/v3_node_picker.dart',
              '            final ok = await controller.testLatencies();',
              "            final failureText = v3Copy(context, zh: '测速失败或所有节点超时', en: 'Test failed or all nodes timed out', tw: '測速失敗或所有節點逾時');\n            final ok = await controller.testLatencies();")
          fix('lib/v3/ui/v3_node_picker.dart',
              "messenger.showSnackBar(SnackBar(content: Text(v3Copy(context,\n                zh: '测速失败或所有节点超时',\n                en: 'Test failed or all nodes timed out',\n                tw: '測速失敗或所有節點逾時'))));",
              'messenger.showSnackBar(SnackBar(content: Text(failureText)));')
          PY
          dart format lib/shared/models/app_models.dart lib/shared/models/model_mappers.dart lib/shared/services/panel_api.dart lib/shared/services/data_loader.dart lib/shared/services/node_tag_matcher.dart lib/app/node_controller.dart lib/app/app_controller.dart lib/app/core_controller.dart lib/v3/ui/v3_node_tags.dart lib/v3/ui/v3_node_picker.dart lib/v3/pages/v3_nodes_page.dart lib/v3/pages/v3_dashboard_page.dart test/node_tag_matcher_test.dart test/visual/v3_node_labels_live_speed_test.dart test/visual/v3_node_test_button_test.dart
          git diff --check
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/node_tag_matcher_test.dart test/visual/v3_node_labels_live_speed_test.dart test/visual/v3_node_test_button_test.dart
      - run: flutter test
      - name: Commit only validated source and test changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f tool/node_fix_payload.lzma.b64 .github/workflows/v3-node-tags-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(nodes): show real tags and add explicit batched latency testing'
          git push origin HEAD:fix/v3-node-tags-live-speed-20260919
