name: V3 Cleanup Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v3-cleanup-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Mirror final legacy cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib/features
          rm -f lib/app/app_shell.dart
          rm -rf test/visual/goldens
          find test/visual -maxdepth 1 -type f -name '*.dart' ! -name 'v3_visual_acceptance_test.dart' ! -name 'v3_visual_fixture.dart' -delete
          python3 - <<'PY'
          from pathlib import Path
          skip = {
              Path('test/v3_clean_boundary_test.dart'),
              Path('test/visual/v3_visual_acceptance_test.dart'),
              Path('test/visual/v3_visual_fixture.dart'),
          }
          markers = (
              'lib/features/',
              'package:litchi_client/features/',
              'app_shell.dart',
              'shared/layout/app_shell_spec.dart',
              'shared/theme/app_theme.dart',
              'shared/widgets/',
          )
          for path in Path('test').rglob('*.dart'):
              if path in skip:
                  continue
              text = path.read_text(encoding='utf-8')
              legacy_named = 'greenfield' in path.name.lower() or '_v2_' in path.name.lower() or path.name.endswith('_v2_test.dart')
              if legacy_named or any(marker in text for marker in markers):
                  path.unlink()

          shell = Path('lib/v3/app/v3_shell.dart')
          text = shell.read_text(encoding='utf-8')
          text = text.replace("import 'dart:io';\n\nimport 'package:flutter/material.dart';", "import 'package:flutter/foundation.dart';\nimport 'package:flutter/material.dart';")
          text = text.replace('class V3Shell extends StatelessWidget {', "bool get _isDesktopTarget => !kIsWeb && switch (defaultTargetPlatform) {\n  TargetPlatform.windows || TargetPlatform.macOS || TargetPlatform.linux => true,\n  _ => false,\n};\n\nclass V3Shell extends StatelessWidget {", 1)
          text = text.replace('  bool get _desktop => Platform.isWindows || Platform.isMacOS || Platform.isLinux;', '  bool get _desktop => _isDesktopTarget;')
          text = text.replace('    if (!Platform.isWindows && !Platform.isMacOS && !Platform.isLinux) {', '    if (!_isDesktopTarget) {')
          text = text.replace('            if (!Platform.isMacOS) ...[', '            if (defaultTargetPlatform != TargetPlatform.macOS) ...[')
          shell.write_text(text, encoding='utf-8')

          boundary = Path('test/v3_clean_boundary_test.dart')
          text = boundary.read_text(encoding='utf-8')
          if 'legacy presentation tree is physically removed' not in text:
              insert = """

            test('legacy presentation tree is physically removed', () {
              expect(Directory('lib/features').existsSync(), isFalse);
              expect(File('lib/app/app_shell.dart').existsSync(), isFalse);
            });
          """
              pos = text.rfind('\n}')
              text = text[:pos] + insert + text[pos:]
              boundary.write_text(text, encoding='utf-8')
          PY
          dart format lib/v3/app/v3_shell.dart test/v3_clean_boundary_test.dart test/visual/v3_visual_acceptance_test.dart test/visual/v3_visual_fixture.dart
      - run: flutter pub get
      - name: Capture full Flutter test output
        shell: bash
        run: |
          set -o pipefail
          flutter test -r expanded 2>&1 | tee v3-cleanup-flutter-test.log
      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-cleanup-test-log-${{ github.sha }}
          path: v3-cleanup-flutter-test.log
          if-no-files-found: warn
          retention-days: 3
