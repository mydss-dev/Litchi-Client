name: Desktop Stage 9 Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-stage9-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Apply final viewport cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/features/nodes/nodes_page.dart',
              '''    final tableHeight = (MediaQuery.sizeOf(context).height - 280)\n        .clamp(300.0, 900.0)\n        .toDouble();''',
              '''    // Leave enough room for the title/search/auto/filter controls so the\n    // outer desktop shell does not need to scroll at 800x600. Only the node\n    // viewport itself scrolls in normal desktop window sizes.\n    final tableHeight = (MediaQuery.sizeOf(context).height - 330)\n        .clamp(260.0, 900.0)\n        .toDouble();''',
          )

          replace_once(
              'lib/shared/widgets/responsive_page_scaffold.dart',
              '''    final list = ListView(\n      shrinkWrap: CorePlatformSupport.isDesktop,\n      physics: CorePlatformSupport.isDesktop\n          ? const NeverScrollableScrollPhysics()\n          : (onRefresh == null ? null : const AlwaysScrollableScrollPhysics()),\n      padding: EdgeInsets.zero,''',
              '''    final list = ListView(\n      physics: onRefresh == null ? null : const AlwaysScrollableScrollPhysics(),\n      padding: EdgeInsets.zero,''',
          )

          replace_once(
              'lib/features/invite/invite_page.dart',
              '''/// Invite — the mobile invite page.\n///\n/// Invitation cards, actions, statistics, and commission records. A\n/// `viewportFraction` page controller gives the code carousel its peeking\n/// viewport.''',
              '''/// Invite and referral commission page.\n///\n/// Desktop uses a full-width carousel/statistics layout; compact platforms keep\n/// the peeking invite-code carousel and pull-to-refresh presentation.''',
          )
          replace_once(
              'lib/features/invite/invite_page.dart',
              '''      child: ListView(\n        shrinkWrap: CorePlatformSupport.isDesktop,\n        physics: CorePlatformSupport.isDesktop\n            ? const NeverScrollableScrollPhysics()\n            : const AlwaysScrollableScrollPhysics(),\n        padding: EdgeInsets.zero,''',
              '''      child: ListView(\n        physics: const AlwaysScrollableScrollPhysics(),\n        padding: EdgeInsets.zero,''',
          )
          PY

      - name: Format and check
        shell: bash
        run: |
          dart format \
            lib/features/nodes/nodes_page.dart \
            lib/features/invite/invite_page.dart \
            lib/shared/widgets/responsive_page_scaffold.dart
          flutter pub get
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "mydss-dev"
          git config user.email "180769754+mydss-dev@users.noreply.github.com"
          git add lib/features/nodes/nodes_page.dart lib/features/invite/invite_page.dart lib/shared/widgets/responsive_page_scaffold.dart pubspec.lock
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(desktop): keep node scrolling inside viewport"
          git push origin HEAD:main
