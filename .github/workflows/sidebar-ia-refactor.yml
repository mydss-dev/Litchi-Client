name: Desktop Sidebar IA Refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sidebar-ia-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Apply sidebar IA refactor
        shell: bash
        run: |
          python3 tool/sidebar_ia_refactor.py
          python3 - <<'PY'
          from pathlib import Path

          account = Path('lib/features/account/account_page.dart')
          text = account.read_text()
          if not text.startswith("import 'dart:async';"):
              text = "import 'dart:async';\n\n" + text
          account.write_text(text)

          shell = Path('lib/app/app_shell.dart')
          text = shell.read_text()
          unused = "  final item = kNavDestinations.firstWhere((d) => d.page == page);\n"
          if unused not in text:
              raise SystemExit('unused desktop label fallback anchor not found')
          shell.write_text(text.replace(unused, '', 1))
          PY
          dart format lib/app/app_shell.dart lib/features/account/account_page.dart
          flutter pub get
          flutter test
          flutter analyze
          git diff --check
      - name: Commit verified product changes
        shell: bash
        run: |
          rm tool/sidebar_ia_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(desktop): normalize sidebar information architecture"
          git push origin HEAD:main
