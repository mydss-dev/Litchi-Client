name: Desktop Sidebar IA Refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sidebar-ia-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
      - name: Apply sidebar IA refactor
        shell: bash
        run: |
          python3 tool/sidebar_ia_refactor.py
          dart format lib/app/app_shell.dart lib/features/account/account_page.dart
          flutter pub get
          flutter test
          flutter analyze
          git diff --check
      - name: Commit verified product changes
        shell: bash
        run: |
          rm tool/sidebar_ia_refactor.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(desktop): normalize sidebar information architecture"
          git push origin HEAD:main
