include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Treat missing returns as errors, not warnings.
    missing_return: error
    # Dead code is a sign of logic bugs, not just style.
    dead_code: error
    # Unused imports clutter the namespace and slow analysis.
    unused_import: error
  # Generated build + platform directories must not be analyzed: they contain
  # machine-generated Dart that does not follow project lints and would flood
  # the analyzer with false positives after a build.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # ── Safety ────────────────────────────────────────────────────────────────
    # print() is stripped in release but leaves noise; use debugPrint instead.
    avoid_print: true
    # Catches fire-and-forget futures that swallow errors silently.
    unawaited_futures: true
    # Enforce exhaustive switch cases on enums and sealed types (Dart 3).
    exhaustive_cases: true
    # Avoids accidental mutation of list/map literals shared across callers.
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true

    # ── Style (already consistent in this codebase) ───────────────────────────
    prefer_single_quotes: true
    # Trailing commas enable better dartfmt diff output.
    require_trailing_commas: true
    # Shorter super.param syntax already in use throughout.
    use_super_parameters: true
