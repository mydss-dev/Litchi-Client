plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.litchi.client"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.litchi.client"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Replace debug signing before production release.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

tasks.register("ensureOfficialLibbox") {
    def aar = file("libs/libbox.aar")
    def psScript = file("../../tool/build_libbox_android.ps1")
    def shScript = file("../../tool/build_libbox_android.sh")
    outputs.file(aar)
    doLast {
        def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
        def allowMissingForDebug = requestedTasks.any {
            it.contains("debug") || it.contains("profile")
        }
        if (aar.exists()) {
            logger.lifecycle("Using existing official libbox: ${aar}")
            return
        }
        def buildLibbox = {
            if (System.getProperty("os.name").toLowerCase().contains("windows")) {
                if (!psScript.exists()) {
                    throw new GradleException("Missing libbox build script: ${psScript}")
                }
                providers.exec {
                    commandLine "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", psScript.absolutePath
                }.result.get().assertNormalExitValue()
            } else {
                if (!shScript.exists()) {
                    throw new GradleException("Missing libbox build script: ${shScript}")
                }
                providers.exec {
                    commandLine "bash", shScript.absolutePath
                }.result.get().assertNormalExitValue()
            }
        }
        try {
            buildLibbox()
        } catch (Exception error) {
            if (allowMissingForDebug) {
                logger.warn("Skipping libbox.aar for debug/profile build: ${error.message}")
                return
            }
            throw error
        }
        if (!aar.exists()) {
            if (allowMissingForDebug) {
                logger.warn("Skipping libbox.aar for debug/profile build because it was not generated")
                return
            }
            throw new GradleException("Official libbox.aar was not generated")
        }
    }
}

tasks.named("preBuild") {
    dependsOn("ensureOfficialLibbox")
}

dependencies {
    // Exclude libbox-legacy.aar: it ships the same io.nekohasekai.libbox classes
    // and lib/arm64-v8a/libbox.so as libbox.aar, which collides at
    // mergeReleaseNativeLibs / causes duplicate-class errors. The modern
    // libbox.aar covers our arm64/arm targets.
    implementation fileTree(
        dir: "libs",
        include: ["*.jar", "*.aar"],
        exclude: ["libbox-legacy.aar"],
    )
}
