plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyProperties.load(new FileInputStream(keyPropertiesFile))
}
def hasReleaseSigning =
    keyProperties["storeFile"] &&
    keyProperties["storePassword"] &&
    keyProperties["keyAlias"] &&
    keyProperties["keyPassword"]

android {
    namespace "com.litchi.client"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // White-label CI supplies a stable per-tenant id. Keep the original id
        // for normal local builds.
        applicationId System.getenv("ANDROID_APPLICATION_ID") ?: "com.litchi.client"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keyProperties["storeFile"])
                storePassword keyProperties["storePassword"]
                keyAlias keyProperties["keyAlias"]
                keyPassword keyProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }
}

flutter {
    source "../.."
}

tasks.register("ensureMihomoLibraries") {
    def libraries = [
        file("src/main/jniLibs/arm64-v8a/liblitchi_mihomo.so"),
        file("src/main/jniLibs/armeabi-v7a/liblitchi_mihomo.so"),
    ]
    def headers = [
        file("src/main/cpp/includes/arm64-v8a/liblitchi_mihomo.h"),
        file("src/main/cpp/includes/arm64-v8a/bridge.h"),
        file("src/main/cpp/includes/armeabi-v7a/liblitchi_mihomo.h"),
        file("src/main/cpp/includes/armeabi-v7a/bridge.h"),
    ]
    def psScript = file("../../tool/build_mihomo_android.ps1")
    def shScript = file("../../tool/build_mihomo_android.sh")
    inputs.files(fileTree("../../core/mihomo"), psScript, shScript)
    outputs.files(libraries + headers)
    doLast {
        def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
        def allowMissingForDebug = requestedTasks.any {
            it.contains("debug") || it.contains("profile")
        }
        def buildMihomo = {
            if (System.getProperty("os.name").toLowerCase().contains("windows")) {
                if (!psScript.exists()) {
                    throw new GradleException("Missing mihomo build script: ${psScript}")
                }
                providers.exec {
                    commandLine "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", psScript.absolutePath
                }.result.get().assertNormalExitValue()
            } else {
                if (!shScript.exists()) {
                    throw new GradleException("Missing mihomo build script: ${shScript}")
                }
                providers.exec {
                    commandLine "bash", shScript.absolutePath
                }.result.get().assertNormalExitValue()
            }
        }
        try {
            buildMihomo()
        } catch (Exception error) {
            if (allowMissingForDebug) {
                logger.warn("Skipping mihomo native build for debug/profile: ${error.message}")
                return
            }
            throw error
        }
        if (!libraries.every { it.exists() }) {
            if (allowMissingForDebug) {
                logger.warn("Skipping missing mihomo libraries for debug/profile")
                return
            }
            throw new GradleException("mihomo Android libraries were not generated")
        }
    }
}

// SHA-256 of a file as a lowercase hex string (used to verify geo downloads).
String geoSha256(File f) {
    def md = java.security.MessageDigest.getInstance("SHA-256")
    f.withInputStream { input ->
        byte[] buf = new byte[65536]
        int n
        while ((n = input.read(buf)) > 0) {
            md.update(buf, 0, n)
        }
    }
    return md.digest().encodeHex().toString()
}

tasks.register("ensureGeoAssets") {
    // mihomo needs country.mmdb (GEOIP rules) and geosite.dat (GEOSITE rules).
    // Download them into assets at build time so a fresh install never has to
    // fetch geo data at startup. Mirrors ensureMihomoLibraries: runs for every
    // build, local or CI, so nobody downloads geo by hand. Each file lands in a
    // .part temp, is SHA-256 verified, then atomically promoted — an interrupted
    // download is never reused.
    def assetsDir = file("src/main/assets")
    // geo file name -> env var holding its expected SHA-256 (blank = print only)
    def geoFiles = [
        "country.mmdb": "GEOIP_MMDB_SHA256",
        "geosite.dat" : "GEOSITE_DAT_SHA256",
    ]

    // Single source of truth: tool/core_versions.env (GEO_VERSION + hashes).
    def env = [:]
    def envFile = file("../../tool/core_versions.env")
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def m = (line =~ /^\s*([A-Za-z0-9_]+)\s*=\s*(.*?)\s*$/)
            if (m.find()) { env[m.group(1)] = m.group(2).trim() }
        }
    }
    def geoVersion = env.get("GEO_VERSION", "latest")

    inputs.property("geoVersion", geoVersion)
    inputs.property("geoHashes", geoFiles.values().collect { env.get(it, "") })
    outputs.files(geoFiles.keySet().collect { new File(assetsDir, it) })

    doLast {
        assetsDir.mkdirs()
        def base = "https://github.com/MetaCubeX/meta-rules-dat/releases/download/${geoVersion}"
        def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

        geoFiles.each { name, shaVar ->
            def dest = new File(assetsDir, name)
            def expected = (env.get(shaVar, "") ?: "").toLowerCase()

            // A present file is always complete (atomic promotion below). When a
            // hash is pinned, re-verify it and refetch on mismatch.
            if (dest.exists() && dest.length() > 0) {
                if (expected.isEmpty() || geoSha256(dest) == expected) {
                    logger.lifecycle("geo asset OK: ${name}")
                    return
                }
                logger.lifecycle("geo asset ${name} hash mismatch — refetching")
            }

            def url = "${base}/${name}"
            def tmp = new File(assetsDir, "${name}.part")
            tmp.delete()
            logger.lifecycle("Downloading ${name} (${geoVersion})")
            try {
                if (isWindows) {
                    providers.exec {
                        commandLine "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass",
                            "-Command", "Invoke-WebRequest -Uri '${url}' -OutFile '${tmp.absolutePath}'"
                    }.result.get().assertNormalExitValue()
                } else {
                    providers.exec {
                        commandLine "curl", "-fsSL", url, "-o", tmp.absolutePath
                    }.result.get().assertNormalExitValue()
                }

                if (!tmp.exists() || tmp.length() == 0L) {
                    throw new GradleException("Empty download: ${url}")
                }
                def actual = geoSha256(tmp)
                if (expected.isEmpty()) {
                    logger.lifecycle("  ${name} sha256 = ${actual}  (paste into core_versions.env to lock)")
                } else if (actual != expected) {
                    throw new GradleException("${name} sha256 mismatch: actual=${actual} expected=${expected}")
                } else {
                    logger.lifecycle("  ${name} sha256 verified")
                }

                // Verified — promote atomically (same dir → atomic rename).
                java.nio.file.Files.move(
                    tmp.toPath(),
                    dest.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                )
            } finally {
                tmp.delete()
            }
        }
    }
}

tasks.named("preBuild") {
    dependsOn("ensureMihomoLibraries")
    dependsOn("ensureGeoAssets")
}
