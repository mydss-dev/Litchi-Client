plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyProperties.load(new FileInputStream(keyPropertiesFile))
}
def hasReleaseSigning = keyProperties["storeFile"] && keyProperties["storePassword"] &&
    keyProperties["keyAlias"] && keyProperties["keyPassword"]
def splitPerAbi = project.hasProperty("split-per-abi") &&
    project.property("split-per-abi").toString().toBoolean()

android {
    namespace "com.litchi.client"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    defaultConfig {
        applicationId System.getenv("ANDROID_APPLICATION_ID") ?: "com.litchi.client"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        ndk {
            if (!splitPerAbi) {
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            }
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keyProperties["storeFile"])
                storePassword keyProperties["storePassword"]
                keyAlias keyProperties["keyAlias"]
                keyPassword keyProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter { source "../.." }

dependencies {
    implementation files("libs/libbox.aar")
}

tasks.register("ensureLibboxAar") {
    def aar = file("libs/libbox.aar")
    def psScript = file("../../tool/build_libbox_android.ps1")
    def shScript = file("../../tool/build_libbox_android.sh")
    inputs.files(psScript, shScript, file("../../tool/core_versions.env"))
    outputs.file(aar)
    doLast {
        if (System.getProperty("os.name").toLowerCase().contains("windows")) {
            if (!psScript.exists()) throw new GradleException("Missing libbox build script: ${psScript}")
            providers.exec {
                commandLine "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", psScript.absolutePath
            }.result.get().assertNormalExitValue()
        } else {
            if (!shScript.exists()) throw new GradleException("Missing libbox build script: ${shScript}")
            providers.exec { commandLine "bash", shScript.absolutePath }.result.get().assertNormalExitValue()
        }
        if (!aar.exists()) throw new GradleException("libbox.aar was not generated")
    }
}

tasks.named("preBuild") { dependsOn("ensureLibboxAar") }
