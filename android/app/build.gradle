plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyProperties.load(new FileInputStream(keyPropertiesFile))
}
def hasReleaseSigning =
    keyProperties["storeFile"] &&
    keyProperties["storePassword"] &&
    keyProperties["keyAlias"] &&
    keyProperties["keyPassword"]

android {
    namespace "com.litchi.client"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // White-label CI supplies a stable per-tenant id. Keep the original id
        // for normal local builds.
        applicationId System.getenv("ANDROID_APPLICATION_ID") ?: "com.litchi.client"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keyProperties["storeFile"])
                storePassword keyProperties["storePassword"]
                keyAlias keyProperties["keyAlias"]
                keyPassword keyProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }
}

flutter {
    source "../.."
}

tasks.register("ensureMihomoLibraries") {
    def libraries = [
        file("src/main/jniLibs/arm64-v8a/liblitchi_mihomo.so"),
        file("src/main/jniLibs/armeabi-v7a/liblitchi_mihomo.so"),
    ]
    def headers = [
        file("src/main/cpp/includes/arm64-v8a/liblitchi_mihomo.h"),
        file("src/main/cpp/includes/arm64-v8a/bridge.h"),
        file("src/main/cpp/includes/armeabi-v7a/liblitchi_mihomo.h"),
        file("src/main/cpp/includes/armeabi-v7a/bridge.h"),
    ]
    def psScript = file("../../tool/build_mihomo_android.ps1")
    def shScript = file("../../tool/build_mihomo_android.sh")
    inputs.files(fileTree("../../core/mihomo"), psScript, shScript)
    outputs.files(libraries + headers)
    doLast {
        def requestedTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
        def allowMissingForDebug = requestedTasks.any {
            it.contains("debug") || it.contains("profile")
        }
        def buildMihomo = {
            if (System.getProperty("os.name").toLowerCase().contains("windows")) {
                if (!psScript.exists()) {
                    throw new GradleException("Missing mihomo build script: ${psScript}")
                }
                providers.exec {
                    commandLine "powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", psScript.absolutePath
                }.result.get().assertNormalExitValue()
            } else {
                if (!shScript.exists()) {
                    throw new GradleException("Missing mihomo build script: ${shScript}")
                }
                providers.exec {
                    commandLine "bash", shScript.absolutePath
                }.result.get().assertNormalExitValue()
            }
        }
        try {
            buildMihomo()
        } catch (Exception error) {
            if (allowMissingForDebug) {
                logger.warn("Skipping mihomo native build for debug/profile: ${error.message}")
                return
            }
            throw error
        }
        if (!libraries.every { it.exists() }) {
            if (allowMissingForDebug) {
                logger.warn("Skipping missing mihomo libraries for debug/profile")
                return
            }
            throw new GradleException("mihomo Android libraries were not generated")
        }
    }
}

tasks.named("preBuild") {
    dependsOn("ensureMihomoLibraries")
}
